<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 RNG 시뮬레이터: Ultimate Gimmick Update</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR:wght@300;500;700&family=Rajdhani:wght@600&display=swap');

        :root {
            --glow-primary: #FF416C;
            --glow-secondary: #00E5FF;
            --ui-bg: rgba(10, 10, 15, 0.65);
            --ui-border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            font-family: 'Noto Sans KR', sans-serif; 
            background: #000; color: white; user-select: none; 
            cursor: crosshair;
            transition: box-shadow 0.3s ease; /* 피버 타임 테두리 전환용 */
        }

        /* ★ [기믹 1] 피버 타임 테두리 효과 */
        body.fever-active {
            box-shadow: inset 0 0 50px #FFD700, inset 0 0 150px rgba(255, 215, 0, 0.5);
        }

        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        #game-canvas { z-index: 1; } 
        #fog-overlay { position: absolute; top:0; left:0; width:100vw; height:100vh; z-index: 5; pointer-events: none; }
        #vfx-canvas { z-index: 8; pointer-events: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }

        /* ★ [기믹 3] 페이크(글리치) 이펙트용 CSS */
        #glitch-overlay { position: absolute; top:0; left:0; width:100vw; height:100vh; z-index: 99; background: white; opacity: 0; pointer-events: none; mix-blend-mode: exclusion; transition: opacity 0.1s; }
        .glitch-text { animation: glitch 0.2s infinite; font-family: monospace !important; color: #ff0000 !important; text-shadow: 2px 2px 0px #00ffff, -2px -2px 0px #ff0000 !important; }
        @keyframes glitch { 0% { transform: translate(2px, 0); } 20% { transform: translate(-2px, 0); } 40% { transform: translate(0, 2px); } 60% { transform: translate(0, -2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(-2px, 2px); } }

        #lightning-flash { 
            position: absolute; 
            top:0; left:0; 
            width:100vw; height:100vh; 
            z-index: 98; 
            background: white; 
            opacity: 0; 
            pointer-events: none; 
            mix-blend-mode: overlay; 
            transition: opacity 0.05s ease-out; 
        }
        #weather-notification { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.8s ease-in-out; z-index: 20; }
        #weather-notification.show { opacity: 1; animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #weather-notif-title { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; color: #aaa; letter-spacing: 5px; margin-bottom: 5px; text-transform: uppercase;}
        #weather-notif-name { font-family: 'Cinzel', serif; font-size: 4.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.8); letter-spacing: 12px; }
        @keyframes popUp { from { transform: translate(-50%, -40%); } to { transform: translate(-50%, -50%); } }

        .glass-panel { background: var(--ui-bg); backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%); border: 1px solid var(--ui-border); border-radius: 12px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255,255,255,0.05); color: white; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }

        #top-ui { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
        #time-weather-info { padding: 10px 20px; text-align: center; }
        #time-display { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,255,255,0.8); } 
        #weather-display { font-size: 0.85rem; color: #b0b0c0; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; }
        #currency-display { font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700; color: #FFD700; text-shadow: 0 0 10px #FFD700; margin-bottom: 8px; text-align: right; }

        /* ★ [기믹 1] 콤보 미터 UI (좌측 하단) */
        #combo-display { position: absolute; bottom: 20px; left: 20px; font-family: 'Rajdhani', sans-serif; font-weight: 700; color: #FFD700; text-shadow: 0 0 10px #FFD700; display: none; transition: transform 0.1s; z-index: 15;}
        #combo-count { font-size: 2.5rem; letter-spacing: 1px; }
        #combo-message { font-size: 0.9rem; color: #fff; margin-bottom: 3px; font-weight: 600; text-shadow: 0 0 5px white;}
        #combo-bar-bg { width: 150px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
        #combo-bar { width: 100%; height: 100%; background: #FFD700; box-shadow: 0 0 5px #FFD700; transition: width 0.1s linear; }

        .menu-btn-group { display: flex; gap: 8px; }
        .menu-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.8rem; font-weight: 500; color: rgba(255, 255, 255, 0.8); cursor: pointer; display: flex; align-items: center; gap: 6px; border-radius: 8px; padding: 8px 15px; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .menu-btn::before { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
        .menu-btn:hover::before { left: 100%; }
        .menu-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #fff; color: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* 💡 [수정] 스테이지 전체가 스르륵 사라질 수 있도록 트랜지션 추가 */
        #stage { position: absolute; bottom: 150px; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s ease-out; }
        /* 💡 [수정] 텍스트가 스르륵 사라지고 나타나도록 opacity 트랜지션 추가 */
        #aura-text { font-family: 'Cinzel', serif; font-size: 3.5rem; font-weight: 700; letter-spacing: 2px; transition: color 0.1s, text-shadow 0.1s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease-out; text-transform: uppercase; } 
        #odds-text { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 600; color: rgba(255,255,255,0.8); margin-top: 5px; display: none; text-shadow: 0 0 5px rgba(255,255,255,0.5); }

        #buff-display { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; font-size: 0.8rem; color: #88c0d0; font-weight: 700; text-shadow: 0 0 5px rgba(136, 192, 208, 0.5); }

        #control-area { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; align-items: center; }

        #roll-btn { background: linear-gradient(45deg, #FF416C, #FF4B2B); border: none; padding: 15px 50px; font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; color: white; font-weight: 700; letter-spacing: 3px; border-radius: 40px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 65, 108, 0.5), inset 0 0 10px rgba(255,255,255,0.3); transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); text-transform: uppercase; }
        #roll-btn:hover { box-shadow: 0 0 35px rgba(255, 65, 108, 0.8); transform: scale(1.05); }
        #roll-btn:active { transform: scale(0.95); }

        .decision-btn { background: var(--ui-bg); backdrop-filter: blur(10px); padding: 12px 30px; font-size: 1rem; font-weight: 700; border-radius: 25px; cursor: pointer; display: none; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px; color: white;}
        #btn-keep { border: 2px solid #38ef7d; color: #38ef7d; box-shadow: 0 0 10px rgba(56, 239, 125, 0.2); }
        #btn-keep:hover { background: #38ef7d; color: #000; box-shadow: 0 0 25px rgba(56, 239, 125, 0.6); transform: translateY(-2px); }
        #btn-discard { border: 2px solid #8E2DE2; color: #8E2DE2; box-shadow: 0 0 10px rgba(142, 45, 226, 0.2); }
        #btn-discard:hover { background: #8E2DE2; color: #fff; box-shadow: 0 0 25px rgba(142, 45, 226, 0.6); transform: translateY(-2px); }

        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; }
        .modal.active { display: flex; animation: modalFadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .modal-content { width: 80%; max-width: 800px; max-height: 75vh; padding: 25px; display: flex; flex-direction: column; background: rgba(15, 15, 25, 0.85); } 
        .modal-header { padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); margin: 0; }
        .close-btn { font-size: 1.8rem; color: #aaa; background: transparent; border: none; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #FF416C; text-shadow: 0 0 10px #FF416C; transform: rotate(90deg); }
        
        .scroll-list { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: max-content; align-items: stretch; gap: 15px; margin-top: 15px; padding: 5px; }
        .scroll-list::-webkit-scrollbar { width: 6px; } .scroll-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; } .scroll-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; } .scroll-list::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.6); }

        .item-card { padding: 15px; border-radius: 10px; background: rgba(30,30,40,0.6); box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; height: 100%; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.05); }
        .item-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.7); border-color: rgba(255,255,255,0.2); }
        .item-name { font-weight: 700; font-size: 1rem; margin-bottom: 5px; text-shadow: 0 0 5px currentColor; }
        .item-desc { font-size: 0.75rem; color: #a0a0b0; line-height: 1.4; flex-grow: 1; }
        .item-cost { color: #FFD700; font-size: 0.8rem; margin-top: 8px; font-weight: bold; }

        .action-sm-btn { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; text-transform: uppercase; color: white;}
        .btn-craft { border: 1px solid #64B5F6; color: #64B5F6; } .btn-craft:hover { background: #64B5F6; color: #000; box-shadow: 0 0 10px #64B5F6; }
        .btn-equip { border: 1px solid #81C784; color: #81C784; } .btn-equip:hover { background: #81C784; color: #000; box-shadow: 0 0 10px #81C784; }
        .btn-unequip { border: 1px solid #E57373; color: #E57373; } .btn-unequip:hover { background: #E57373; color: #fff; box-shadow: 0 0 10px #E57373; }
        .btn-scrap { border: 1px solid #E53935; color: #E53935; margin-top: 5px;} .btn-scrap:hover { background: #E53935; color: #fff; box-shadow: 0 0 10px #E53935; }
        .btn-alchemy { border: 1px solid #CE93D8; color: #CE93D8; } .btn-alchemy:hover { background: #CE93D8; color: #000; box-shadow: 0 0 10px #CE93D8; }
        .disabled-btn { border-color: #444 !important; color: #666 !important; cursor: not-allowed !important; background: rgba(0,0,0,0.5) !important; box-shadow: none !important; }

        .req-auras { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); font-size: 0.7rem; color: #999; display: flex; flex-wrap: wrap; gap: 4px; }
        .req-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: 600; background: rgba(0,0,0,0.5); white-space: nowrap; }

        .inv-item-card { border-radius: 10px; padding: 12px; background: rgba(20,20,30,0.8); display: flex; flex-direction: column; justify-content: space-between; height: 100%; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .inv-item-card:hover { transform: scale(1.02); }
        .inv-item-top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; margin-bottom: 5px;}
        .inv-name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1rem; }
        .inv-odds { font-family: 'Rajdhani', sans-serif; font-size: 0.75rem; color: #888; }

        #equip-slots { display: flex; justify-content: center; gap: 20px; margin-top: 15px; flex-shrink: 0; }
        .equip-slot { width: 70px; height: 70px; background: rgba(255,255,255,0.02); border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; cursor: pointer; position: relative; transition: 0.3s; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .equip-slot:hover { border-style: solid; border-color: #fff; transform: translateY(-2px); }
        .equip-slot.filled { border: 2px solid #FFD700; background: rgba(255, 215, 0, 0.08); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(255, 215, 0, 0.1); }
        .slot-name { font-size: 0.65rem; position: absolute; bottom: 4px; width: 100%; text-align: center; color: white; font-weight: 600; text-shadow: 0 1px 2px black; }

        /* 💡 [복구] 퀵 아이템 바 스타일 */
        #quick-item-bar {
            position: absolute; left: -220px; top: 50%; transform: translateY(-50%);
            width: 200px; max-height: 60vh;
            background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0 15px 15px 0;
            padding: 15px; z-index: 50; transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; gap: 10px; overflow-y: auto; pointer-events: auto;
        }
        #quick-item-bar.open { left: 0; }
        #quick-item-bar::-webkit-scrollbar { width: 4px; }
        #quick-item-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 2px; }

        #quick-item-toggle {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 30px; height: 60px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2); border-left: none;
            border-radius: 0 10px 10px 0; cursor: pointer; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; z-index: 51; transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto; text-shadow: 0 0 5px white;
        }
        #quick-item-toggle.open { left: 200px; }

        .quick-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 8px;
            cursor: pointer; transition: 0.2s; border: 1px solid transparent; flex-shrink: 0;
        }
        .quick-item:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); transform: translateX(3px); }
        .quick-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 5px currentColor; }
        .quick-info { flex-grow: 1; margin-left: 10px; font-size: 0.85rem; font-weight: 600; text-align: left; line-height: 1.1;}
        .quick-count { font-size: 0.9rem; font-family: 'Rajdhani', sans-serif; font-weight: 700; }
        
        /* UI 레이어 공통 애니메이션 설정 */
        #top-ui, #quick-item-toggle, #quick-item-bar, 
        #combo-display, #buff-display, #control-area {
            transition: opacity 0.8s ease, visibility 0.8s; /* 0.8초 동안 부드럽게 사라짐 */
        }

        /* UI가 숨겨질 때 적용할 클래스 */
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none; /* 클릭 안 되게 방지 */
            visibility: hidden;
        }
    </style>

        !function() { function detectDevTool(allow) { if(isNaN(+allow)) allow = 100; var start = +new Date(); debugger; var end = +new Date(); if(isNaN(start) || isNaN(end) || end - start > allow) { document.location.href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&t=2s" } } if(window.attachEvent) { if (document.readyState === "complete" || document.readyState === "interactive") { detectDevTool(); window.attachEvent('onresize', detectDevTool); window.attachEvent('onmousemove', detectDevTool); window.attachEvent('onfocus', detectDevTool); window.attachEvent('onblur', detectDevTool); } else { setTimeout(argument.callee, 0); } } else { window.addEventListener('load', detectDevTool); window.addEventListener('resize', detectDevTool); window.addEventListener('mousemove', detectDevTool); window.addEventListener('focus', detectDevTool); window.addEventListener('blur', detectDevTool); } }();
    </script>
</head>
<body>

    <canvas id="game-canvas"></canvas>
    <canvas id="vfx-canvas"></canvas>
    <div id="fog-overlay"></div>
    <div id="glitch-overlay"></div> <div id="weather-notification">
        <div id="weather-notif-title">Weather Changed</div>
        <div id="weather-notif-name">RAIN</div>
    </div>
    <div id="lightning-flash"></div>

    <audio id="bgm" loop></audio>
    <audio id="weather-sfx" loop></audio> 
    <audio id="sfx-lightning" src="sfx/lightning.mp3"></audio> 
    <audio id="sfx-roll" src="sfx/roll.mp3"></audio>      
    <audio id="sfx-spin" src="sfx/spin.mp3" loop></audio> 
    <audio id="sfx-click" src="sfx/click.mp3"></audio>    
    <audio id="sfx-success" src="sfx/success.mp3"></audio> 
    <audio id="sfx-equip" src="sfx/equip.mp3"></audio>    
    <audio id="sfx-reveal" src="sfx/reveal.mp3"></audio> 
    <audio id="sfx-glitch" src="sfx/glitch.mp3"></audio> 
    <audio id="sfx-star" src="sfx/star_catch.mp3"></audio>
    <audio id="sfx-meteor-fall" src="sfx/meteor_fall.mp3"></audio> 
    <audio id="sfx-meteor-impact" src="sfx/meteor_impact.mp3"></audio>

    <audio id="sfx-magic-circle" src="sfx/magic_circle.mp3"></audio> 
    <audio id="sfx-meteor-friction" src="sfx/meteor_friction.mp3"></audio> 
    <audio id="sfx-flashbang-ring" src="sfx/flashbang_ring.mp3"></audio>

    <div id="ui-layer">
        <div id="top-ui">
            <div id="time-weather-info" class="glass-panel interactive">
                <div id="time-display">00:00</div>
                <div id="weather-display">맑음</div>
            </div>
            <div>
                <div id="currency-display">✨ Stella Fragment: 0</div>
                <div class="menu-btn-group">
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('consumable-modal', true)">🧪 ITEMS</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('alchemy-modal', true)">⚗️ ALCHEMY</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('inventory-modal', true)">🎒 AURAS</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('crafting-modal', true)">🛠️ CRAFT</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('equipment-modal', true)">🛡️ GEARS</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('settings-modal', true)">⚙️ SETTINGS</button>
                </div>
            </div>
        </div>

        <button id="quick-item-toggle" onclick="toggleQuickBar()">▶</button>
        <div id="quick-item-bar">
            <div style="font-family: 'Cinzel', serif; color: #aaa; text-align: center; font-size: 0.9rem; margin-bottom: 5px; letter-spacing: 2px;">QUICK ITEMS</div>
            <div id="quick-list"></div>
        </div>

        <div id="stage">
            <div id="aura-text">운명의 수레바퀴를 돌리십시오.</div>
            <div id="odds-text">1 in ???</div>
        </div>

        <div id="combo-display">
            <div id="combo-count">0 COMBO</div>
            <div id="combo-message"></div>
            <div id="combo-bar-bg"><div id="combo-bar"></div></div>
        </div>

        <div id="buff-display">
            <span id="buff-luck">🍀 행운: x1.00</span>
            <span id="buff-speed">⚡ 속도: x1.00</span>
        </div>

        <div id="control-area" class="interactive">
            <button id="btn-keep" class="decision-btn">✔ 저장 (Keep)</button>
            <button id="btn-discard" class="decision-btn">✖ 분해 (+✨)</button>
            <button id="roll-btn">🎲 AWAKEN DESTINY</button>
        </div>
