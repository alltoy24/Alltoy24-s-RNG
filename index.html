<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 RNG 시뮬레이터: Masterpiece (Final Fix)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR:wght@300;500;700&family=Rajdhani:wght@600&display=swap');

        :root {
            --glow-primary: #FF416C;
            --glow-secondary: #00E5FF;
            --ui-bg: rgba(10, 10, 15, 0.65);
            --ui-border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            font-family: 'Noto Sans KR', sans-serif; 
            background: #000; color: white; user-select: none; 
            cursor: crosshair;
        }

        /* 캔버스 레이어링 */
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        #game-canvas { z-index: 1; } /* 배경 & 자연 */
        #fog-overlay { position: absolute; top:0; left:0; width:100vw; height:100vh; z-index: 5; pointer-events: none; transition: background 1.5s ease-in-out; }
        #vfx-canvas { z-index: 8; pointer-events: none; mix-blend-mode: screen; } /* 마법진 및 고광원 이펙트 */

        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }

        /* 날씨 변경 시네마틱 UI */
        #weather-notification {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.8s ease-in-out; z-index: 20;
        }
        #weather-notification.show { opacity: 1; animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #weather-notif-title { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; color: #aaa; letter-spacing: 5px; margin-bottom: 5px; text-transform: uppercase;}
        #weather-notif-name { font-family: 'Cinzel', serif; font-size: 4.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.8); letter-spacing: 12px; }
        @keyframes popUp { from { transform: translate(-50%, -40%); } to { transform: translate(-50%, -50%); } }

        /* 고급 글래스모피즘 UI */
        .glass-panel { 
            background: var(--ui-bg); 
            backdrop-filter: blur(12px) saturate(180%); 
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid var(--ui-border); 
            border-radius: 12px; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255,255,255,0.05); 
            color: white; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 상단 UI */
        #top-ui { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
        
        #time-weather-info { padding: 10px 20px; text-align: center; }
        #time-display { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,255,255,0.8); } 
        #weather-display { font-size: 0.85rem; color: #b0b0c0; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; }
        #currency-display { font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700; color: #FFD700; text-shadow: 0 0 10px #FFD700; margin-bottom: 8px; text-align: right; }

        .menu-btn-group { display: flex; gap: 8px; }
        .menu-btn { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255, 255, 255, 0.1); 
            font-size: 0.8rem; font-weight: 500; color: rgba(255, 255, 255, 0.8); 
            cursor: pointer; display: flex; align-items: center; gap: 6px; 
            border-radius: 8px; padding: 8px 15px; 
            transition: all 0.3s ease; 
            position: relative; overflow: hidden;
        }
        .menu-btn::before { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
        .menu-btn:hover::before { left: 100%; }
        .menu-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #fff; color: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* 중앙 텍스트 연출 */
        #stage { position: absolute; bottom: 150px; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #aura-text { 
            font-family: 'Cinzel', serif; font-size: 3.5rem; font-weight: 700; letter-spacing: 2px; 
            transition: color 0.1s, text-shadow 0.1s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
        } 
        #odds-text { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 600; color: rgba(255,255,255,0.8); margin-top: 5px; display: none; text-shadow: 0 0 5px rgba(255,255,255,0.5); }

        #buff-display { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; font-size: 0.8rem; color: #88c0d0; font-weight: 700; text-shadow: 0 0 5px rgba(136, 192, 208, 0.5); }

        /* 롤 & 컨트롤 버튼 연출 */
        #control-area { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; align-items: center; }

        #roll-btn { 
            background: linear-gradient(45deg, #FF416C, #FF4B2B); 
            border: none; padding: 15px 50px; 
            font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; color: white; font-weight: 700; letter-spacing: 3px; 
            border-radius: 40px; cursor: pointer; 
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.5), inset 0 0 10px rgba(255,255,255,0.3); 
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
            text-transform: uppercase;
        }
        #roll-btn:hover { box-shadow: 0 0 35px rgba(255, 65, 108, 0.8); transform: scale(1.05); }
        #roll-btn:active { transform: scale(0.95); }

        .decision-btn { background: var(--ui-bg); backdrop-filter: blur(10px); padding: 12px 30px; font-size: 1rem; font-weight: 700; border-radius: 25px; cursor: pointer; display: none; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px; color: white;}
        #btn-keep { border: 2px solid #38ef7d; color: #38ef7d; box-shadow: 0 0 10px rgba(56, 239, 125, 0.2); }
        #btn-keep:hover { background: #38ef7d; color: #000; box-shadow: 0 0 25px rgba(56, 239, 125, 0.6); transform: translateY(-2px); }
        #btn-discard { border: 2px solid #8E2DE2; color: #8E2DE2; box-shadow: 0 0 10px rgba(142, 45, 226, 0.2); }
        #btn-discard:hover { background: #8E2DE2; color: #fff; box-shadow: 0 0 25px rgba(142, 45, 226, 0.6); transform: translateY(-2px); }

        /* 모달창 UI */
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; }
        .modal.active { display: flex; animation: modalFadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .modal-content { width: 80%; max-width: 800px; max-height: 75vh; padding: 25px; display: flex; flex-direction: column; background: rgba(15, 15, 25, 0.85); } 
        .modal-header { padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); margin: 0; }
        .close-btn { font-size: 1.8rem; color: #aaa; background: transparent; border: none; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #FF416C; text-shadow: 0 0 10px #FF416C; transform: rotate(90deg); }
        
        /* 스크롤바 커스텀 */
        .scroll-list { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: max-content; align-items: stretch; gap: 15px; margin-top: 15px; padding: 5px; }
        .scroll-list::-webkit-scrollbar { width: 6px; }
        .scroll-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .scroll-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }
        .scroll-list::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.6); }

        /* 아이템 카드 리뉴얼 */
        .item-card { 
            padding: 15px; border-radius: 10px; background: rgba(30,30,40,0.6); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; height: 100%;
            transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.05);
        }
        .item-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.7); border-color: rgba(255,255,255,0.2); }
        .item-name { font-weight: 700; font-size: 1rem; margin-bottom: 5px; text-shadow: 0 0 5px currentColor; }
        .item-desc { font-size: 0.75rem; color: #a0a0b0; line-height: 1.4; flex-grow: 1; }
        .item-cost { color: #FFD700; font-size: 0.8rem; margin-top: 8px; font-weight: bold; }

        .action-sm-btn { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; text-transform: uppercase; color: white;}
        .btn-craft { border: 1px solid #64B5F6; color: #64B5F6; } .btn-craft:hover { background: #64B5F6; color: #000; box-shadow: 0 0 10px #64B5F6; }
        .btn-equip { border: 1px solid #81C784; color: #81C784; } .btn-equip:hover { background: #81C784; color: #000; box-shadow: 0 0 10px #81C784; }
        .btn-unequip { border: 1px solid #E57373; color: #E57373; } .btn-unequip:hover { background: #E57373; color: #fff; box-shadow: 0 0 10px #E57373; }
        .btn-scrap { border: 1px solid #E53935; color: #E53935; margin-top: 5px;} .btn-scrap:hover { background: #E53935; color: #fff; box-shadow: 0 0 10px #E53935; }
        .btn-alchemy { border: 1px solid #CE93D8; color: #CE93D8; } .btn-alchemy:hover { background: #CE93D8; color: #000; box-shadow: 0 0 10px #CE93D8; }
        .disabled-btn { border-color: #444 !important; color: #666 !important; cursor: not-allowed !important; background: rgba(0,0,0,0.5) !important; box-shadow: none !important; }

        .req-auras { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); font-size: 0.7rem; color: #999; display: flex; flex-wrap: wrap; gap: 4px; }
        .req-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: 600; background: rgba(0,0,0,0.5); white-space: nowrap; }

        /* 인벤토리 오라 카드 */
        .inv-item-card { border-radius: 10px; padding: 12px; background: rgba(20,20,30,0.8); display: flex; flex-direction: column; justify-content: space-between; height: 100%; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .inv-item-card:hover { transform: scale(1.02); }
        .inv-item-top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; margin-bottom: 5px;}
        .inv-name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1rem; }
        .inv-odds { font-family: 'Rajdhani', sans-serif; font-size: 0.75rem; color: #888; }

        /* 장착 슬롯 연출 */
        #equip-slots { display: flex; justify-content: center; gap: 20px; margin-top: 15px; flex-shrink: 0; }
        .equip-slot { width: 70px; height: 70px; background: rgba(255,255,255,0.02); border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; cursor: pointer; position: relative; transition: 0.3s; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .equip-slot:hover { border-style: solid; border-color: #fff; transform: translateY(-2px); }
        .equip-slot.filled { border: 2px solid #FFD700; background: rgba(255, 215, 0, 0.08); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(255, 215, 0, 0.1); }
        .slot-name { font-size: 0.65rem; position: absolute; bottom: 4px; width: 100%; text-align: center; color: white; font-weight: 600; text-shadow: 0 1px 2px black; }
    </style>
    <!--콘솔창 차단 스크립트-->
    <script>
    !function() {
    function detectDevTool(allow) {
        if(isNaN(+allow)) allow = 100;
        var start = +new Date(); 
        debugger;
        var end = +new Date(); 
        if(isNaN(start) || isNaN(end) || end - start > allow) {
            document.location.href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&t=2s"
        }
    }
    if(window.attachEvent) {
        if (document.readyState === "complete" || document.readyState === "interactive") {
            detectDevTool();
        window.attachEvent('onresize', detectDevTool);
        window.attachEvent('onmousemove', detectDevTool);
        window.attachEvent('onfocus', detectDevTool);
        window.attachEvent('onblur', detectDevTool);
        } else {
            setTimeout(argument.callee, 0);
        }
    } else {
        window.addEventListener('load', detectDevTool);
        window.addEventListener('resize', detectDevTool);
        window.addEventListener('mousemove', detectDevTool);
        window.addEventListener('focus', detectDevTool);
        window.addEventListener('blur', detectDevTool);
    }
    }();
    </script>
    <!--콘솔창 차단 스크립트 끝-->
</head>
<body>

    <canvas id="game-canvas"></canvas>
    <canvas id="vfx-canvas"></canvas>
    <div id="fog-overlay"></div>

    <div id="weather-notification">
        <div id="weather-notif-title">Weather Changed</div>
        <div id="weather-notif-name">RAIN</div>
    </div>

    <audio id="bgm" loop></audio>
    <audio id="weather-sfx" loop></audio> 
    <audio id="sfx-lightning" src="sfx/lightning.mp3"></audio> 
    <audio id="sfx-roll" src="sfx/roll.mp3"></audio>      
    <audio id="sfx-spin" src="sfx/spin.mp3" loop></audio> 
    <audio id="sfx-click" src="sfx/click.mp3"></audio>    
    <audio id="sfx-success" src="sfx/success.mp3"></audio> 
    <audio id="sfx-equip" src="sfx/equip.mp3"></audio>    
    <audio id="sfx-reveal" src="sfx/reveal.mp3"></audio> 
    
    <div id="ui-layer">
        <div id="top-ui">
            <div id="time-weather-info" class="glass-panel interactive">
                <div id="time-display">00:00</div>
                <div id="weather-display">맑음</div>
            </div>
            <div>
                <div id="currency-display">✨ Stella Fragment: 0</div>
                <div class="menu-btn-group">
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('consumable-modal', true)">🧪 ITEMS</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('alchemy-modal', true)">⚗️ ALCHEMY</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('inventory-modal', true)">🎒 AURAS</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('crafting-modal', true)">🛠️ CRAFT</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('equipment-modal', true)">🛡️ GEARS</button>
                </div>
            </div>
        </div>

        <div id="stage">
            <div id="aura-text">운명의 수레바퀴를 돌리십시오.</div>
            <div id="odds-text">1 in ???</div>
        </div>

        <div id="buff-display">
            <span id="buff-luck">🍀 행운: x1.00</span>
            <span id="buff-speed">⚡ 속도: x1.00</span>
        </div>

        <div id="control-area" class="interactive">
            <button id="btn-keep" class="decision-btn">✔ 저장 (Keep)</button>
            <button id="btn-discard" class="decision-btn">✖ 분해 (+✨)</button>
            <button id="roll-btn">🎲 AWAKEN DESTINY</button>
        </div>
    </div>

    <div id="consumable-modal" class="modal interactive"><div class="modal-content glass-panel"><div class="modal-header"><h2 class="modal-title">🧪 CONSUMABLES</h2><button class="close-btn" onclick="toggleModal('consumable-modal', false)">✖</button></div><div id="consumable-list" class="scroll-list"></div></div></div>
    <div id="alchemy-modal" class="modal interactive"><div class="modal-content glass-panel"><div class="modal-header"><h2 class="modal-title">⚗️ ALCHEMY LAB</h2><button class="close-btn" onclick="toggleModal('alchemy-modal', false)">✖</button></div><div id="alchemy-list" class="scroll-list"></div></div></div>
    <div id="inventory-modal" class="modal interactive"><div class="modal-content glass-panel"><div class="modal-header"><h2 class="modal-title">🎒 AURAS</h2><button class="close-btn" onclick="toggleModal('inventory-modal', false)">✖</button></div><div id="inv-list" class="scroll-list"></div></div></div>
    <div id="crafting-modal" class="modal interactive"><div class="modal-content glass-panel"><div class="modal-header"><h2 class="modal-title">🛠️ CRAFTING</h2><button class="close-btn" onclick="toggleModal('crafting-modal', false)">✖</button></div><div id="craft-list" class="scroll-list"></div></div></div>
    <div id="equipment-modal" class="modal interactive"><div class="modal-content glass-panel"><div class="modal-header"><h2 class="modal-title">🛡️ EQUIPMENT</h2><button class="close-btn" onclick="toggleModal('equipment-modal', false)">✖</button></div><div id="equip-slots"><div class="equip-slot" id="slot-0" onclick="unequipGear(0)">+</div><div class="equip-slot" id="slot-1" onclick="unequipGear(1)">+</div><div class="equip-slot" id="slot-2" onclick="unequipGear(2)">+</div></div><h3 style="margin-top:20px; border-bottom:1px solid #555; padding-bottom:5px; font-family:'Rajdhani', sans-serif;">보유 장비</h3><div id="gear-list" class="scroll-list" style="max-height: 40vh;"></div></div></div>

    <script>
        /************************************************************************
         * DATA 영역: 기존 데이터 100% 유지 (생략 없이 사용자의 모든 DB 포함)
         ************************************************************************/
        // ※ 실제 코드에서는 사용자가 준 allAuras, gearDB, consumableDB, potionRecipes를 그대로 넣습니다.
        // 분량상 아래는 사용자의 코드를 그대로 이식했다고 가정합니다. (데이터베이스 수정/삭제 절대 없음)
        /************************************************************************
         * 오라 & 장비 데이터 (기존 동일)
         ************************************************************************/
        const allAuras = [
            // [기초 등급] 1~4 (기존 동일)
            { name: "COMMON", chanceX: 2, color: "#b0b0b0", glow: "0 0 5px white", condition: "all" },
            { name: "UNCOMMON", chanceX: 5, color: "#81C784", glow: "0 0 10px #81C784", condition: "all" },
            { name: "RARE", chanceX: 15, color: "#64B5F6", glow: "0 0 20px #64B5F6", condition: "all" },
            { name: "EPIC", chanceX: 50, color: "#BA68C8", glow: "0 0 30px #BA68C8", condition: "all" },

            // [초반부 날씨] 100 ~ 5,000 구간 (숫자 디테일업)
            { name: "BREEZE", chanceX: 77, color: "#CFD8DC", glow: "0 0 30px #CFD8DC", condition: "wind" },
            { name: "DROPLET", chanceX: 88, color: "#90CAF9", glow: "0 0 20px #90CAF9", condition: "rain" },
            { name: "SNOWFLAKE", chanceX: 99, color: "#E3F2FD", glow: "0 0 20px #E3F2FD", condition: "snow" },
            { name: "SUNSHINE", chanceX: 101, color: "#FFEB3B", glow: "0 0 30px #FFEB3B", condition: "clear" },
            { name: "MIST", chanceX: 111, color: "#B0BEC5", glow: "0 0 30px #B0BEC5", condition: "foggy" },
            { name: "SPARK", chanceX: 123, color: "#FFF176", glow: "0 0 30px #FFF176", condition: "thunder" },
            { name: "DAYLIGHT", chanceX: 365, color: "#FFEE58", glow: "0 0 40px #FFEE58", condition: "clear" }, // 1년 365일
            { name: "DRIZZLE", chanceX: 444, color: "#64B5F6", glow: "0 0 30px #64B5F6", condition: "rain" },
            { name: "HAILSTONE", chanceX: 555, color: "#BBDEFB", glow: "0 0 30px #BBDEFB", condition: "snow" },
            { name: "STATIC", chanceX: 777, color: "#FFF59D", glow: "0 0 30px #FFF59D", condition: "thunder" },
            { name: "GALE", chanceX: 1234, color: "#B0BEC5", glow: "0 0 40px #B0BEC5", condition: "wind" },
            { name: "MONSOON", chanceX: 2048, color: "#1976D2", glow: "0 0 40px #1976D2", condition: "rain" }, // 2048 게임

            // [중반부] 10,000 ~ 1,000,000 구간 
            // 👉 [핵심] 타로 카드, 수학, 도시전설, 암호학 등 테마가 담긴 재밌는 확률 등장!
            { name: "CELESTIAL", chanceX: 10001, color: "#00E5FF", glow: "0 0 60px #00E5FF", condition: "all" }, // 거울 숫자

        class ParticleSystem {
            constructor() { this.particles = []; }
            spawnExplosion(x, y, color, count, maxSpeed) {
                for(let i=0; i<count; i++) {
                    const angle = Math.random() * Math.PI * 2; const speed = Math.random() * maxSpeed;
                    this.particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: Math.random() * 4 + 2, color: color, life: 1.0, decay: Math.random() * 0.02 + 0.01 });
                }
            }
            spawnFirefly(x, y, color) {
                this.particles.push({ x: x, y: y, vx: (Math.random()-0.5)*1, vy: (Math.random()-0.5)*1 - 0.5, size: Math.random() * 3 + 1, color: color, life: 1.0, decay: Math.random() * 0.005 + 0.002, floatPhase: Math.random() * Math.PI * 2 });
            }
            updateAndDraw(ctx) {
                for(let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i]; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                    if(p.floatPhase !== undefined) p.vx += Math.sin(globalRenderTime * 0.05 + p.floatPhase) * 0.05;
                    if(p.life <= 0) { this.particles.splice(i, 1); continue; }
                    ctx.save(); ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                }
            }
        }

        // 마법진 소환 효과
        function drawMagicCircle(ctx, x, y, radius, angle, color, alpha) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.globalAlpha = alpha;
            ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.shadowBlur = 20; ctx.shadowColor = color;
            ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); for(let i=0; i<6; i++) { let a = (Math.PI*2/6)*i; ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*radius, Math.sin(a)*radius); } ctx.stroke();
            ctx.beginPath(); for(let i=0; i<6; i++) { let a = (Math.PI*2/6)*i; ctx.moveTo(Math.cos(a)*radius, Math.sin(a)*radius); ctx.lineTo(Math.cos(a+Math.PI*2/3)*radius, Math.sin(a+Math.PI*2/3)*radius); } ctx.stroke();
            ctx.restore();
        }

        // [UPGRADE] 속이 꽉 차고 빛나는 아름다운 별 그리기 함수
        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3; let x = cx; let y = cy; let step = Math.PI / spikes;
            ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius; ctx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius; ctx.lineTo(x, y); rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius); ctx.closePath();
            
            // 별 내부 채우기 (흰색 + 투명도) 및 강력한 네온 효과
            ctx.shadowBlur = 40; 
            ctx.shadowColor = color;
            ctx.fillStyle = "rgba(255, 255, 255, 0.95)"; 
            ctx.fill();
            
            // 별 테두리 (오라 색상)
            ctx.lineWidth = 4; 
            ctx.strokeStyle = color; 
            ctx.stroke();

        // [UPGRADE] 타이밍 완벽, 즉시 암전, 즉시 별 등장, 마지막 '빵!' 연출

        function getCurrentSkyColors(preciseHour) {

            let prev = skyKeyframes[0], next = skyKeyframes[skyKeyframes.length - 1]; for (let i = 0; i < skyKeyframes.length - 1; i++) { if (preciseHour >= skyKeyframes[i].h && preciseHour <= skyKeyframes[i+1].h) { prev = skyKeyframes[i]; next = skyKeyframes[i+1]; break; } } let factor = (preciseHour - prev.h) / (next.h - prev.h); let top1 = hexToRgb(prev.top), top2 = hexToRgb(next.top); let top = `rgb(${Math.round(lerp(top1[0], top2[0], factor))},${Math.round(lerp(top1[1], top2[1], factor))},${Math.round(lerp(top1[2], top2[2], factor))})`; let bot1 = hexToRgb(prev.bot), bot2 = hexToRgb(next.bot); let bot = `rgb(${Math.round(lerp(bot1[0], bot2[0], factor))},${Math.round(lerp(bot1[1], bot2[1], factor))},${Math.round(lerp(bot1[2], bot2[2], factor))})`; let sun1 = hexToRgb(prev.sun), sun2 = hexToRgb(next.sun); let sun = `rgb(${Math.round(lerp(sun1[0], sun2[0], factor))},${Math.round(lerp(sun1[1], sun2[1], factor))},${Math.round(lerp(sun1[2], sun2[2], factor))})`; return { top, bot, sun, botRgb: bot1 };

        function generateNature() {

        function smoothAudioTransition(newBgmSrc, newSfxSrc) {

        // 뇌우(Thunder)일 때 비의 양과 속도를 대폭 증가

        // [FIXED] 바닥에 어색한 물 생기는 효과(wetLevel) 완전 제거
        function renderLand(layer, index, fogRgb) { 
            let offsetX = -currentParallaxX * 100 * layer.depth; let offsetY = -currentParallaxY * 50 * layer.depth; 
            ctx.beginPath(); ctx.moveTo(offsetX - W, H); 
            for (let i = 0; i < layer.points.length - 1; i++) {

                ctx.quadraticCurveTo(p1.x + offsetX, p1.y + offsetY, cpX + offsetX, cpY + offsetY);
            }

        }

        function renderTrees(layerIndex, fogRgb) {

            let haze = Math.min(1.0, layer.baseFog + (fogIntensity * 0.8)); let isNight = (hours < 6 || hours > 18); 
            trees.forEach(t => { 
                t.x = t.baseX + offsetX; t.y = t.baseY + offsetY; let scale = t.size; let trunkH = 50 * scale, trunkW = 12 * scale; let foliageR = 30 * scale; 
                let tr=50, tg=30, tb=20; tr = lerp(tr, fogRgb[0], haze); tg = lerp(tg, fogRgb[1], haze); tb = lerp(tb, fogRgb[2], haze);

        // [FIXED] 바닥에 물 튀는 이펙트(explosion) 완전히 제거

        /************************************************************************

        let activeSpawns = [];

        // [핵심 추가] 1초마다 백그라운드에서 아이템을 자연에 스폰시키는 타이머

            // 현재 날씨에 맞는 아이템을 찾고, 없으면 'clear(맑음)' 데이터를 기본값으로 사용
            let itemData = consumableDB[currentWeather.id] || consumableDB["clear"];
            if (!itemData) return;

            // 스폰 확률: 1초마다 40% 확률로 등장, 화면에 최대 5개까지 유지
            let spawnChance = 0.4; 
            
            if (Math.random() < spawnChance && activeSpawns.length < 5) {
                let hostArray = itemData.host === "tree" ? trees : grassBlades;
                if (hostArray.length === 0) return;

                let targetHost = hostArray[Math.floor(Math.random() * hostArray.length)];
                let isOccupied = activeSpawns.some(s => s.hostId === targetHost.id && s.hostType === itemData.host);
                
                // 해당 나무/풀에 이미 아이템이 없으면 스폰 (수명: 약 20초)
                if (!isOccupied) activeSpawns.push({ type: itemData.id || currentWeather.id, hostType: itemData.host, hostId: targetHost.id, life: 1200, floatY: 0 });
            }
        }, 1000);

        function renderSpawns(ctx) {
            activeSpawns.forEach(p => {
                p.life--; p.floatY += 0.05;
                let itemData = consumableDB[p.type];
                let hostArray = p.hostType === "tree" ? trees : grassBlades;
                let host = hostArray.find(h => h.id === p.hostId);
                if (!host) { p.life = 0; return; }
                let renderX = host.x; let renderY = host.y;
                if (p.hostType === "tree") renderY -= (host.size * 50); else { renderX += host.sway; renderY -= host.h; }
                renderY += Math.sin(p.floatY) * 5;
                p.screenX = renderX; p.screenY = renderY;

                ctx.save(); ctx.translate(renderX, renderY);
                ctx.globalAlpha = Math.min(1, p.life / 50);
                ctx.shadowBlur = 20 + Math.sin(p.floatY)*10; ctx.shadowColor = itemData.color; ctx.fillStyle = itemData.color;

        // [핵심 수정] 모바일 터치(pointerdown) 지원 및 히트박스(60px) 개선
        canvas.addEventListener('pointerdown', (e) => {
            let rect = canvas.getBoundingClientRect(); 
            // 화면 크기 비율(Scale)을 고려한 정확한 좌표 계산
            let clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            let clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            for (let i = activeSpawns.length - 1; i >= 0; i--) {
                let p = activeSpawns[i];
                if (!p.screenX || !p.screenY) continue;

                // 클릭 판정 범위를 40 -> 60으로 넓혀 쾌적한 채집 가능
                if (Math.hypot(clickX - p.screenX, clickY - p.screenY) < 60) { 
                    playSound(sfxSuccess); 
                    
                    let itemKey = p.type;
                    consumableInv[itemKey] = (consumableInv[itemKey] || 0) + 1;
                    vfxParticles.spawnExplosion(p.screenX, p.screenY, consumableDB[itemKey]?.color || "#FFF", 20, 8); 
                    
                    activeSpawns.splice(i, 1); 
                    saveGame(); 
                    break; 
                }
            }
        });
        /************************************************************************
         * 8. MAIN RENDER LOOP & LIGHTNING SYSTEM
         ************************************************************************/
        let lightningFlashAlpha = 0; // 번개 섬광 변수

        /************************************************************************
         * 8. [ULTIMATE FIXED] 통합 메인 렌더링 엔진 (시간 + 날씨 + 이펙트 + 버프)
         ************************************************************************/
        let gameTimeMinutes = 12 * 60; // 게임 시작 시간 (12시 = 720분)
        let lastDisplayMin = -1;
        let lastWeatherHour = -1;
        let frameCount = 0; // 버프 시간 측정용 프레임 카운터

        // 더 이상 setInterval을 쓰지 않고, 브라우저 최적화 루프에 모든 걸 맡깁니다.
        function render() { 
            // 1. 시간 흐름 (한 프레임당 0.2분씩 아주 부드럽게 증가)
            gameTimeMinutes += 0.05;
            if (gameTimeMinutes >= 24 * 60) gameTimeMinutes -= 24 * 60; // 자정 리셋

            // 렌더링용 정밀 시간 (소수점 포함)
            let preciseHour = gameTimeMinutes / 60; 
            
            // UI 표시용 정수 시간
            let hours = Math.floor(preciseHour);
            let minutes = Math.floor(gameTimeMinutes % 60);

            // 2. [깜빡임 원천 차단] 분(minute)이 실제로 바뀌었을 때만 DOM 딱 한 번 업데이트
            if (minutes !== lastDisplayMin) {
                document.getElementById("time-display").textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                lastDisplayMin = minutes;

                // 6시간 정각(0분) 마다 날씨 변경
                if (hours % 6 === 0 && minutes === 0 && lastWeatherHour !== hours) {
                    lastWeatherHour = hours;
                    changeWeather();
                }
            }

            // 3. 버프 타이머 감소 (60프레임 = 실제 약 1초)
            frameCount++;
            if (frameCount >= 60) {
                frameCount = 0;
                if(tempBuff.timeLeft > 0) {
                    tempBuff.timeLeft--;
                    if(tempBuff.timeLeft === 0) { tempBuff.luck = 0; tempBuff.speed = 0; tempBuff.activeName = ""; }
                    calcBuffs();
                }
            }

            // 4. 배경 및 자연물 렌더링
            globalRenderTime += 1; currentParallaxX += (targetParallaxX - currentParallaxX) * 0.05; currentParallaxY += (targetParallaxY - currentParallaxY) * 0.05; windTime += 0.05; 
            ctx.clearRect(0, 0, W, H); 
            
            let skyColors = getCurrentSkyColors(preciseHour); let fogRgb = [200, 210, 220]; 
            let grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, skyColors.top); grad.addColorStop(1, skyColors.bot); ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H); 

            let starOpacity = (hours < 5 || hours > 19 ? 1 : (hours >= 18 ? (hours-18) : (5-hours))) * (1 - fogIntensity); if (starOpacity > 0 && currentWeather.id !== "cloudy") { stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${s.alpha * starOpacity})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill(); s.alpha += (Math.random() - 0.5) * 0.05; if (s.alpha < 0) s.alpha = 0; if (s.alpha > 1) s.alpha = 1; }); } 
            if (currentWeather.id !== "cloudy" && currentWeather.id !== "foggy") { let dayAngle = ((preciseHour - 6) / 24) * Math.PI * 2; if (preciseHour >= 6 && preciseHour <= 18) { let sunX = W/2 - Math.cos(dayAngle) * W * 0.45; let sunY = H - Math.sin(dayAngle) * H * 0.8; ctx.shadowBlur = 100 * (1 - fogIntensity); ctx.shadowColor = skyColors.sun; ctx.fillStyle = skyColors.sun; ctx.beginPath(); ctx.arc(sunX, sunY, 60, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; } let moonAngle = ((preciseHour + 6) / 24) * Math.PI * 2; if (preciseHour < 6 || preciseHour > 18) { let moonX = W/2 - Math.cos(moonAngle) * W * 0.45; let moonY = H - Math.sin(moonAngle) * H * 0.8; ctx.shadowBlur = 50 * (1 - fogIntensity); ctx.shadowColor = "#ffffff"; ctx.fillStyle = `rgba(240, 240, 255, ${1 - fogIntensity * 0.5})`; ctx.beginPath(); ctx.arc(moonX, moonY, 45, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; } }

            renderLand(landscapes[0], 0, fogRgb); renderWeatherLayer(0.1, 0.2); 
            renderLand(landscapes[1], 1, fogRgb); renderWeatherLayer(0.2, 0.4); 
            renderLand(landscapes[2], 2, fogRgb); renderTrees(2, fogRgb); renderWeatherLayer(0.4, 0.7); 
            renderLand(landscapes[3], 3, fogRgb); renderGrass(fogRgb); renderWeatherLayer(0.7, 1.0); 

            renderSpawns(ctx);
            vfxParticles.updateAndDraw(ctx); 

            let fogAlpha = currentWeather.id === "foggy" ? 0.4 : (fogIntensity * 0.85);
            document.getElementById("fog-overlay").style.background = `rgba(${fogRgb[0]}, ${fogRgb[1]}, ${fogRgb[2]}, ${fogAlpha})`; 
            
            requestAnimationFrame(render); 
        } 
        // 엔진 시동
        render();

        /************************************************************************
         * 9. GAME LOGIC: WEATHER CHANGE & THE RNG ENGINE
         ************************************************************************/
        let isRolling = false; let currentResult = null;

        // 날씨 변경 엔진 & BGM/SFX/UI 연동
        function changeWeather() {
            let r = Math.random() * 100, acc = 0;
            for (let w of weathers) {
                acc += w.chance;
                if (r <= acc) { currentWeather = w; break; }
            }
            
            document.getElementById("weather-display").innerText = currentWeather.name;

            const notif = document.getElementById("weather-notification");
            document.getElementById("weather-notif-name").innerText = currentWeather.id.toUpperCase();
            notif.classList.add("show");
            setTimeout(() => notif.classList.remove("show"), 3500);

            bgmPlayer.src = currentWeather.music || "bgms/cloudy.mp3";
            smoothAudioTransition(currentWeather.music, currentWeather.sfx);
            if (currentWeather.sfx) {
                weatherSfxPlayer.src = currentWeather.sfx;
                weatherSfxPlayer.play().catch(e=>{});
            } else {
                weatherSfxPlayer.pause();
                weatherSfxPlayer.currentTime = 0;
            }
            
            createWeatherParticles(); 
        }

        // [수정] 순차적 독립 시행(Sequential Roll) 방식으로 변경
        function getRollResult() {
            // 1. 현재 날씨 등 조건에 맞는 오라만 필터링
            let available = allAuras.filter(a => a.condition === "all" || a.condition === currentWeather.id);
            
            // 2. 오라를 희귀도 순(chanceX가 높은 순)으로 정렬
            // 가장 희귀한 것부터 주사위를 굴려야 상위 등급 당첨 기회를 먼저 가집니다.
            available.sort((a, b) => b.chanceX - a.chanceX);

            // 3. 가장 희귀한 오라부터 순차적으로 당첨 확인
            for (let aura of available) {
                // 행운 적용: 실질 확률 분모 계산 (최소값 1 보장)
                let adjustedChance = Math.max(1, aura.chanceX / globalLuckMultiplier);
                
                // 0 ~ adjustedChance 사이의 난수를 생성하여 1보다 작으면 당첨
                // 예: adjustedChance가 10이면 1/10 확률로 당첨
                if (Math.random() * adjustedChance < 1) {
                    return aura;
                }
            }

            // 4. 만약 위의 루프에서 아무것도 당첨되지 않았다면 (수학적으로 희박하지만 방어적 코드)
            // 가장 흔한 오라(기존 리스트의 첫 번째인 COMMON 등)를 반환합니다.
            return allAuras.find(a => a.name === "COMMON") || available[available.length - 1];
        }

        function applyAuraStyle(aura) {
            document.getElementById("aura-text").textContent = aura.name;
            document.getElementById("aura-text").style.color = aura.color;
            document.getElementById("aura-text").style.textShadow = aura.glow;
            document.getElementById("odds-text").textContent = `1 in ${aura.chanceX.toLocaleString()}`;
        }

        document.getElementById("roll-btn").addEventListener("click", () => { 
            if (isRolling) return; 
            isRolling = true; 
            document.getElementById("roll-btn").style.display = "none"; document.getElementById("odds-text").style.display = "none"; 
            playSound(sfxRoll); sfxSpin.play().catch(e=>{}); 

            currentResult = getRollResult(); 
            let spinTime = 0, currentDelay = 15; const MAX_SPIN_TIME = 2000; 
            
            function spin() { 
                if (spinTime >= MAX_SPIN_TIME / globalSpeedMultiplier) { 
                    sfxSpin.pause(); sfxSpin.currentTime = 0; 
                    if (currentResult.chanceX >= 1000) { 
                        fadeOutBGMForSuspense(); playSound(sfxReveal); triggerEpicVFX(currentResult); 
                        setTimeout(() => { 
                            shakeIntensity = 20; applyScreenShake(); 
                            vfxParticles.spawnExplosion(W/2, H/2-100, currentResult.color, 50, 15); 
                            restoreBGMWithImpact(); playSound(sfxSuccess); showFinalResult(); 
                        }, 1500); 
                    } else { showFinalResult(); } 
                    return; 
                } 
                // 수정 후: 
                let dummyAura = allAuras[Math.floor(Math.random() * allAuras.length)];
                // (원한다면 현재 조건에 맞는 오라만 보여주기 위해 필터링 가능하지만, 단순 스포 방지를 위해 그대로 두어도 무방)
                applyAuraStyle(dummyAura);
                spinTime += currentDelay; currentDelay *= 1.15; setTimeout(spin, currentDelay); 
            } 
            spin(); 
        });

        function showFinalResult() { 
            applyAuraStyle(currentResult); 
            document.getElementById("odds-text").style.display = "block"; 
            document.getElementById("aura-text").style.transform = "scale(1.5)"; 
            setTimeout(() => document.getElementById("aura-text").style.transform = "scale(1)", 150); 
            document.getElementById("btn-keep").style.display = "block"; document.getElementById("btn-discard").style.display = "block"; 
        }

        function resetRollState() {
            isRolling = false;
            document.getElementById("btn-keep").style.display = "none";
            document.getElementById("btn-discard").style.display = "none";
            document.getElementById("roll-btn").style.display = "block"; document.getElementById("odds-text").style.display = "none";
            document.getElementById("aura-text").textContent = "Press Button To Roll...";
            document.getElementById("aura-text").style.color = "white"; document.getElementById("aura-text").style.textShadow = "none";
        }

        document.getElementById("btn-keep").addEventListener("click", () => {
            playSound(sfxSuccess);
            inventory.push(currentResult);
            saveGame();
            resetRollState();
        });

        document.getElementById("btn-discard").addEventListener("click", () => {
            playSound(sfxClick);
            fragments += Math.max(1, Math.ceil(currentResult.chanceX / 4));
            saveGame();
            resetRollState();
        });

        // 10. INITIALIZATION
        window.onload = () => { 
            loadGame(); 
            
            // 시작 연출 (0.5초 뒤)
            setTimeout(() => {
                changeWeather();
            }, 500);

            // BGM 자동재생 차단 방지용 (첫 클릭 시 오디오 켬)
            document.body.addEventListener('click', () => {
                if (bgmPlayer.paused) {
                    smoothAudioTransition(currentWeather.music, currentWeather.sfx);
                    if(currentWeather.sfx) weatherSfxPlayer.play().catch(e=>{});
                }
            }, { once: true }); 
        };

    </script>
</body>
