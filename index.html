<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 RNG 시뮬레이터: Ultimate Gimmick Update</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR:wght@300;500;700&family=Rajdhani:wght@600&display=swap');

        :root {
            --glow-primary: #FF416C;
            --glow-secondary: #00E5FF;
            --ui-bg: rgba(10, 10, 15, 0.65);
            --ui-border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            font-family: 'Noto Sans KR', sans-serif; 
            background: #000; color: white; user-select: none; 
            cursor: crosshair;
            transition: box-shadow 0.3s ease; /* 피버 타임 테두리 전환용 */
        }

        /* ★ [기믹 1] 피버 타임 테두리 효과 */
        body.fever-active {
            box-shadow: inset 0 0 50px #FFD700, inset 0 0 150px rgba(255, 215, 0, 0.5);
        }

        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        #game-canvas { z-index: 1; } 
        #fog-overlay { position: absolute; top:0; left:0; width:100vw; height:100vh; z-index: 5; pointer-events: none; }
        #vfx-canvas { z-index: 8; pointer-events: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }

        /* ★ [기믹 3] 페이크(글리치) 이펙트용 CSS */
        #glitch-overlay { position: absolute; top:0; left:0; width:100vw; height:100vh; z-index: 99; background: white; opacity: 0; pointer-events: none; mix-blend-mode: exclusion; transition: opacity 0.1s; }
        .glitch-text { animation: glitch 0.2s infinite; font-family: monospace !important; color: #ff0000 !important; text-shadow: 2px 2px 0px #00ffff, -2px -2px 0px #ff0000 !important; }
        @keyframes glitch { 0% { transform: translate(2px, 0); } 20% { transform: translate(-2px, 0); } 40% { transform: translate(0, 2px); } 60% { transform: translate(0, -2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(-2px, 2px); } }

        #lightning-flash { 
            position: absolute; 
            top:0; left:0; 
            width:100vw; height:100vh; 
            z-index: 98; 
            background: white; 
            opacity: 0; 
            pointer-events: none; 
            mix-blend-mode: overlay; 
            transition: opacity 0.05s ease-out; 
        }
        #weather-notification { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.8s ease-in-out; z-index: 20; }
        #weather-notification.show { opacity: 1; animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #weather-notif-title { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; color: #aaa; letter-spacing: 5px; margin-bottom: 5px; text-transform: uppercase;}
        #weather-notif-name { font-family: 'Cinzel', serif; font-size: 4.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.8); letter-spacing: 12px; }
        @keyframes popUp { from { transform: translate(-50%, -40%); } to { transform: translate(-50%, -50%); } }

        .glass-panel { background: var(--ui-bg); backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%); border: 1px solid var(--ui-border); border-radius: 12px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255,255,255,0.05); color: white; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }

        #top-ui { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
        #time-weather-info { padding: 10px 20px; text-align: center; }
        #time-display { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,255,255,0.8); } 
        #weather-display { font-size: 0.85rem; color: #b0b0c0; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; }
        #currency-display { font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700; color: #FFD700; text-shadow: 0 0 10px #FFD700; margin-bottom: 8px; text-align: right; }

        /* ★ [기믹 1] 콤보 미터 UI (좌측 하단) */
        #combo-display { position: absolute; bottom: 20px; left: 20px; font-family: 'Rajdhani', sans-serif; font-weight: 700; color: #FFD700; text-shadow: 0 0 10px #FFD700; display: none; transition: transform 0.1s; z-index: 15;}
        #combo-count { font-size: 2.5rem; letter-spacing: 1px; }
        #combo-message { font-size: 0.9rem; color: #fff; margin-bottom: 3px; font-weight: 600; text-shadow: 0 0 5px white;}
        #combo-bar-bg { width: 150px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
        #combo-bar { width: 100%; height: 100%; background: #FFD700; box-shadow: 0 0 5px #FFD700; transition: width 0.1s linear; }

        .menu-btn-group { display: flex; gap: 8px; }
        .menu-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.8rem; font-weight: 500; color: rgba(255, 255, 255, 0.8); cursor: pointer; display: flex; align-items: center; gap: 6px; border-radius: 8px; padding: 8px 15px; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .menu-btn::before { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
        .menu-btn:hover::before { left: 100%; }
        .menu-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #fff; color: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* 💡 [수정] 스테이지 전체가 스르륵 사라질 수 있도록 트랜지션 추가 */
        #stage { position: absolute; bottom: 150px; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s ease-out; }
        /* 💡 [수정] 텍스트가 스르륵 사라지고 나타나도록 opacity 트랜지션 추가 */
        #aura-text { font-family: 'Cinzel', serif; font-size: 3.5rem; font-weight: 700; letter-spacing: 2px; transition: color 0.1s, text-shadow 0.1s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease-out; text-transform: uppercase; } 
        #odds-text { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 600; color: rgba(255,255,255,0.8); margin-top: 5px; display: none; text-shadow: 0 0 5px rgba(255,255,255,0.5); }

        #buff-display { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; font-size: 0.8rem; color: #88c0d0; font-weight: 700; text-shadow: 0 0 5px rgba(136, 192, 208, 0.5); }

        #control-area { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; align-items: center; }

        #roll-btn { background: linear-gradient(45deg, #FF416C, #FF4B2B); border: none; padding: 15px 50px; font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; color: white; font-weight: 700; letter-spacing: 3px; border-radius: 40px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 65, 108, 0.5), inset 0 0 10px rgba(255,255,255,0.3); transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); text-transform: uppercase; }
        #roll-btn:hover { box-shadow: 0 0 35px rgba(255, 65, 108, 0.8); transform: scale(1.05); }
        #roll-btn:active { transform: scale(0.95); }

        .decision-btn { background: var(--ui-bg); backdrop-filter: blur(10px); padding: 12px 30px; font-size: 1rem; font-weight: 700; border-radius: 25px; cursor: pointer; display: none; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px; color: white;}
        #btn-keep { border: 2px solid #38ef7d; color: #38ef7d; box-shadow: 0 0 10px rgba(56, 239, 125, 0.2); }
        #btn-keep:hover { background: #38ef7d; color: #000; box-shadow: 0 0 25px rgba(56, 239, 125, 0.6); transform: translateY(-2px); }
        #btn-discard { border: 2px solid #8E2DE2; color: #8E2DE2; box-shadow: 0 0 10px rgba(142, 45, 226, 0.2); }
        #btn-discard:hover { background: #8E2DE2; color: #fff; box-shadow: 0 0 25px rgba(142, 45, 226, 0.6); transform: translateY(-2px); }

        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; }
        .modal.active { display: flex; animation: modalFadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .modal-content { width: 80%; max-width: 800px; max-height: 75vh; padding: 25px; display: flex; flex-direction: column; background: rgba(15, 15, 25, 0.85); } 
        .modal-header { padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); margin: 0; }
        .close-btn { font-size: 1.8rem; color: #aaa; background: transparent; border: none; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #FF416C; text-shadow: 0 0 10px #FF416C; transform: rotate(90deg); }
        
        .scroll-list { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: max-content; align-items: stretch; gap: 15px; margin-top: 15px; padding: 5px; }
        .scroll-list::-webkit-scrollbar { width: 6px; } .scroll-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; } .scroll-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; } .scroll-list::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.6); }

        .item-card { padding: 15px; border-radius: 10px; background: rgba(30,30,40,0.6); box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; height: 100%; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.05); }
        .item-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.7); border-color: rgba(255,255,255,0.2); }
        .item-name { font-weight: 700; font-size: 1rem; margin-bottom: 5px; text-shadow: 0 0 5px currentColor; }
        .item-desc { font-size: 0.75rem; color: #a0a0b0; line-height: 1.4; flex-grow: 1; }
        .item-cost { color: #FFD700; font-size: 0.8rem; margin-top: 8px; font-weight: bold; }

        .action-sm-btn { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; text-transform: uppercase; color: white;}
        .btn-craft { border: 1px solid #64B5F6; color: #64B5F6; } .btn-craft:hover { background: #64B5F6; color: #000; box-shadow: 0 0 10px #64B5F6; }
        .btn-equip { border: 1px solid #81C784; color: #81C784; } .btn-equip:hover { background: #81C784; color: #000; box-shadow: 0 0 10px #81C784; }
        .btn-unequip { border: 1px solid #E57373; color: #E57373; } .btn-unequip:hover { background: #E57373; color: #fff; box-shadow: 0 0 10px #E57373; }
        .btn-scrap { border: 1px solid #E53935; color: #E53935; margin-top: 5px;} .btn-scrap:hover { background: #E53935; color: #fff; box-shadow: 0 0 10px #E53935; }
        .btn-alchemy { border: 1px solid #CE93D8; color: #CE93D8; } .btn-alchemy:hover { background: #CE93D8; color: #000; box-shadow: 0 0 10px #CE93D8; }
        .disabled-btn { border-color: #444 !important; color: #666 !important; cursor: not-allowed !important; background: rgba(0,0,0,0.5) !important; box-shadow: none !important; }

        .req-auras { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); font-size: 0.7rem; color: #999; display: flex; flex-wrap: wrap; gap: 4px; }
        .req-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: 600; background: rgba(0,0,0,0.5); white-space: nowrap; }

        .inv-item-card { border-radius: 10px; padding: 12px; background: rgba(20,20,30,0.8); display: flex; flex-direction: column; justify-content: space-between; height: 100%; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .inv-item-card:hover { transform: scale(1.02); }
        .inv-item-top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; margin-bottom: 5px;}
        .inv-name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1rem; }
        .inv-odds { font-family: 'Rajdhani', sans-serif; font-size: 0.75rem; color: #888; }

        #equip-slots { display: flex; justify-content: center; gap: 20px; margin-top: 15px; flex-shrink: 0; }
        .equip-slot { width: 70px; height: 70px; background: rgba(255,255,255,0.02); border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; cursor: pointer; position: relative; transition: 0.3s; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .equip-slot:hover { border-style: solid; border-color: #fff; transform: translateY(-2px); }
        .equip-slot.filled { border: 2px solid #FFD700; background: rgba(255, 215, 0, 0.08); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(255, 215, 0, 0.1); }
        .slot-name { font-size: 0.65rem; position: absolute; bottom: 4px; width: 100%; text-align: center; color: white; font-weight: 600; text-shadow: 0 1px 2px black; }

        /* 💡 [복구] 퀵 아이템 바 스타일 */
        #quick-item-bar {
            position: absolute; left: -220px; top: 50%; transform: translateY(-50%);
            width: 200px; max-height: 60vh;
            background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0 15px 15px 0;
            padding: 15px; z-index: 50; transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; gap: 10px; overflow-y: auto; pointer-events: auto;
        }
        #quick-item-bar.open { left: 0; }
        #quick-item-bar::-webkit-scrollbar { width: 4px; }
        #quick-item-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 2px; }

        #quick-item-toggle {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 30px; height: 60px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2); border-left: none;
            border-radius: 0 10px 10px 0; cursor: pointer; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; z-index: 51; transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto; text-shadow: 0 0 5px white;
        }
        #quick-item-toggle.open { left: 200px; }

        .quick-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 8px;
            cursor: pointer; transition: 0.2s; border: 1px solid transparent; flex-shrink: 0;
        }
        .quick-item:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); transform: translateX(3px); }
        .quick-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 5px currentColor; }
        .quick-info { flex-grow: 1; margin-left: 10px; font-size: 0.85rem; font-weight: 600; text-align: left; line-height: 1.1;}
        .quick-count { font-size: 0.9rem; font-family: 'Rajdhani', sans-serif; font-weight: 700; }
        
        /* UI 레이어 공통 애니메이션 설정 */
        #top-ui, #quick-item-toggle, #quick-item-bar, 
        #combo-display, #buff-display, #control-area {
            transition: opacity 0.8s ease, visibility 0.8s; /* 0.8초 동안 부드럽게 사라짐 */
        }

        /* UI가 숨겨질 때 적용할 클래스 */
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none; /* 클릭 안 되게 방지 */
            visibility: hidden;
        }
    </style>

        !function() { function detectDevTool(allow) { if(isNaN(+allow)) allow = 100; var start = +new Date(); debugger; var end = +new Date(); if(isNaN(start) || isNaN(end) || end - start > allow) { document.location.href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&t=2s" } } if(window.attachEvent) { if (document.readyState === "complete" || document.readyState === "interactive") { detectDevTool(); window.attachEvent('onresize', detectDevTool); window.attachEvent('onmousemove', detectDevTool); window.attachEvent('onfocus', detectDevTool); window.attachEvent('onblur', detectDevTool); } else { setTimeout(argument.callee, 0); } } else { window.addEventListener('load', detectDevTool); window.addEventListener('resize', detectDevTool); window.addEventListener('mousemove', detectDevTool); window.addEventListener('focus', detectDevTool); window.addEventListener('blur', detectDevTool); } }();
    </script>
</head>
<body>

    <canvas id="game-canvas"></canvas>
    <canvas id="vfx-canvas"></canvas>
    <div id="fog-overlay"></div>
    <div id="glitch-overlay"></div> <div id="weather-notification">
        <div id="weather-notif-title">Weather Changed</div>
        <div id="weather-notif-name">RAIN</div>
    </div>
    <div id="lightning-flash"></div>

    <audio id="bgm" loop></audio>
    <audio id="weather-sfx" loop></audio> 
    <audio id="sfx-lightning" src="sfx/lightning.mp3"></audio> 
    <audio id="sfx-roll" src="sfx/roll.mp3"></audio>      
    <audio id="sfx-spin" src="sfx/spin.mp3" loop></audio> 
    <audio id="sfx-click" src="sfx/click.mp3"></audio>    
    <audio id="sfx-success" src="sfx/success.mp3"></audio> 
    <audio id="sfx-equip" src="sfx/equip.mp3"></audio>    
    <audio id="sfx-reveal" src="sfx/reveal.mp3"></audio> 
    <audio id="sfx-glitch" src="sfx/glitch.mp3"></audio> 
    <audio id="sfx-star" src="sfx/star_catch.mp3"></audio>
    <audio id="sfx-meteor-fall" src="sfx/meteor_fall.mp3"></audio> 
    <audio id="sfx-meteor-impact" src="sfx/meteor_impact.mp3"></audio>

    <audio id="sfx-magic-circle" src="sfx/magic_circle.mp3"></audio> 
    <audio id="sfx-meteor-friction" src="sfx/meteor_friction.mp3"></audio> 
    <audio id="sfx-flashbang-ring" src="sfx/flashbang_ring.mp3"></audio>

    <div id="ui-layer">
        <div id="top-ui">
            <div id="time-weather-info" class="glass-panel interactive">
                <div id="time-display">00:00</div>
                <div id="weather-display">맑음</div>
            </div>
            <div>
                <div id="currency-display">✨ Stella Fragment: 0</div>
                <div class="menu-btn-group">
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('consumable-modal', true)">🧪 ITEMS</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('alchemy-modal', true)">⚗️ ALCHEMY</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('inventory-modal', true)">🎒 AURAS</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('crafting-modal', true)">🛠️ CRAFT</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('equipment-modal', true)">🛡️ GEARS</button>
                    <button class="menu-btn glass-panel interactive" onclick="toggleModal('settings-modal', true)">⚙️ SETTINGS</button>
                </div>
            </div>
        </div>

        <button id="quick-item-toggle" onclick="toggleQuickBar()">▶</button>
        <div id="quick-item-bar">
            <div style="font-family: 'Cinzel', serif; color: #aaa; text-align: center; font-size: 0.9rem; margin-bottom: 5px; letter-spacing: 2px;">QUICK ITEMS</div>
            <div id="quick-list"></div>
        </div>

        <div id="stage">
            <div id="aura-text">운명의 수레바퀴를 돌리십시오.</div>
            <div id="odds-text">1 in ???</div>
        </div>

        <div id="combo-display">
            <div id="combo-count">0 COMBO</div>
            <div id="combo-message"></div>
            <div id="combo-bar-bg"><div id="combo-bar"></div></div>
        </div>

        <div id="buff-display">
            <span id="buff-luck">🍀 행운: x1.00</span>
            <span id="buff-speed">⚡ 속도: x1.00</span>
        </div>

        <div id="control-area" class="interactive">
            <button id="btn-keep" class="decision-btn">✔ 저장 (Keep)</button>
            <button id="btn-discard" class="decision-btn">✖ 분해 (+✨)</button>
            <button id="roll-btn">🎲 AWAKEN DESTINY</button>
        </div>

        function calcBuffs() { 
            // 1. 장비 버프
            let gearLuck = 0, gearSpeed = 0; 
            equippedGears.forEach(gearId => { 
                if (gearId !== null) { 
                    let gear = gearDB.find(g => g.id === gearId); 
                    if (gear) { gearLuck += gear.luck; gearSpeed += gear.speed; }

            }); 
            
            // 2. 날씨 및 피버타임 버프
            let weatherLuck = currentWeather.buff ? currentWeather.buff.luck : 0;
            let weatherSpeed = currentWeather.buff ? currentWeather.buff.speed : 0;
            let feverLuck = isFeverTime ? 1.0 : 0;
            let feverSpeed = isFeverTime ? 1.0 : 0;

            // ★ 3. [복구] 4개 슬롯의 소비 아이템 버프를 모두 합산
            let consumableLuck = 0, consumableSpeed = 0;
            if (activeBuffs.gather_luck) consumableLuck += activeBuffs.gather_luck.val;
            if (activeBuffs.potion_luck) consumableLuck += activeBuffs.potion_luck.val;
            if (activeBuffs.gather_speed) consumableSpeed += activeBuffs.gather_speed.val;
            if (activeBuffs.potion_speed) consumableSpeed += activeBuffs.potion_speed.val;

            // 4. 최종 확률 적용
            globalLuckMultiplier = 1.0 + gearLuck + consumableLuck + weatherLuck + feverLuck; 
            globalSpeedMultiplier = 1.0 + gearSpeed + consumableSpeed + weatherSpeed + feverSpeed; 

            if(globalSpeedMultiplier < 0.2) globalSpeedMultiplier = 0.2;

            let buffText = "";

            let displayedNames = []; 
            Object.values(activeBuffs).forEach(buff => {

                }
            });

            if (weatherLuck !== 0 || weatherSpeed !== 0) {

                let weatherName = currentWeather.id === "glitch" ? `<span class="glitch-text">${currentWeather.name}</span>` : currentWeather.name;

                        line.y -= line.speed; // 선이 위로 빠르게 이동 (추락감 극대화)
                        if (line.y < -line.len) { line.y = H + line.len; line.x = Math.random() * W; } // 화면 위로 나가면 아래서 재생성
                        
                        let grad = vfxCtx.createLinearGradient(line.x, line.y, line.x - line.len/4, line.y + line.len);
                        grad.addColorStop(0, 'transparent');
                        grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${spaceAlpha * 0.5})`);
                        grad.addColorStop(1, 'transparent');
                        
                        vfxCtx.strokeStyle = grad;
                        vfxCtx.beginPath();
                        vfxCtx.moveTo(line.x, line.y); 
                        vfxCtx.lineTo(line.x - line.len/4, line.y + line.len); // 사선
                        vfxCtx.stroke();
                    });
                    vfxCtx.globalCompositeOperation = 'source-over';
                }

                // [공통] 운석 위치 및 각도 계산
                let fallProgress = 0;
                let startX = W * 0.85; let startY = H * 0.1;
                let endX = W * 0.5;    let endY = H;
                let dx = endX - startX; let dy = endY - startY;
                let angle = Math.atan2(dy, dx);
                let mX = startX, mY = startY;

                // 3. ✨ [개선] 웅장한 운석 본체 & 플라즈마 꼬리 ✨
                if (progress > 0.15 && progress < 0.75) {
                    // 가속도 적용 (처음엔 느리게, 갈수록 빠르게)
                    let t = (progress - 0.15) / 0.60;
                    fallProgress = t * t * t; // Cubic ease-in
                    
                    mX = lerp(startX, endX, fallProgress);
                    mY = lerp(startY, endY, fallProgress);

                    vfxCtx.save();
                    vfxCtx.translate(mX, mY);
                    vfxCtx.rotate(angle); 

                    // ★ 빛의 중첩 모드 (겹칠수록 눈부시게 하얗게 변함)
                    vfxCtx.globalCompositeOperation = 'lighter'; 

                    // [디테일 1] 다중 플라즈마 꼬리
                    let tailLen = 600 + fallProgress * 1500; // 갈수록 꼬리가 길어짐
                    let tailGrad = vfxCtx.createLinearGradient(0, 0, -tailLen, 0);
                    tailGrad.addColorStop(0, '#ffffff');
                    tailGrad.addColorStop(0.1, `rgba(${r}, ${g}, ${b}, 1)`);
                    tailGrad.addColorStop(0.4, `rgba(${r}, ${g}, ${b}, 0.5)`);
                    tailGrad.addColorStop(1, 'transparent');

                    vfxCtx.fillStyle = tailGrad;
                    vfxCtx.beginPath();
                    vfxCtx.moveTo(30, 0); 
                    // 꼬리가 바람에 흩날리는 듯한 곡선
                    vfxCtx.bezierCurveTo(-100, -80, -300, -30, -tailLen, 0);
                    vfxCtx.bezierCurveTo(-300, 30, -100, 80, 30, 0);
                    vfxCtx.fill();

                    // [디테일 2] 대기 마찰열 (Bow Shock - 앞부분 반원)
                    vfxCtx.beginPath();
                    vfxCtx.arc(20, 0, 50, -Math.PI/2, Math.PI/2);
                    vfxCtx.lineWidth = 10;
                    vfxCtx.strokeStyle = `rgba(255, 255, 255, 0.7)`;
                    vfxCtx.shadowBlur = 30; vfxCtx.shadowColor = aura.color;
                    vfxCtx.stroke();

                    // [디테일 3] 코어 (눈이 멀 것 같은 중심)
                    vfxCtx.fillStyle = "#fff";
                    vfxCtx.shadowBlur = 150; vfxCtx.shadowColor = aura.color;
                    vfxCtx.beginPath(); vfxCtx.ellipse(0, 0, 50, 30, 0, 0, Math.PI*2); vfxCtx.fill();
                    // 안쪽 초고온 코어
                    vfxCtx.beginPath(); vfxCtx.ellipse(10, 0, 30, 15, 0, 0, Math.PI*2); vfxCtx.fill();

                    // [디테일 4] 스파크 잔해 지속 생성
                    if (Math.random() < 0.8) {
                        trailParticles.push({
                            x: mX, y: mY, 
                            vx: Math.cos(angle + Math.PI)* (Math.random()*15 + 10) + (Math.random()-0.5)*10, 
                            vy: Math.sin(angle + Math.PI)* (Math.random()*15 + 10) + (Math.random()-0.5)*10,
                            life: 1.0, size: Math.random() * 12 + 5,
                            decay: Math.random() * 0.02 + 0.01
                        });
                    }
                    vfxCtx.restore();
                }

                // [디테일 5] 스파크 잔해 렌더링 (lighter 블렌딩)
                vfxCtx.globalCompositeOperation = 'lighter';
                for(let i=trailParticles.length-1; i>=0; i--) {
                    let tp = trailParticles[i];
                    tp.x += tp.vx; tp.y += tp.vy; tp.life -= tp.decay;
                    if(tp.life <= 0) { trailParticles.splice(i, 1); continue; }
                    vfxCtx.fillStyle = `rgba(${r},${g},${b},${tp.life})`;
                    vfxCtx.shadowBlur = 10; vfxCtx.shadowColor = aura.color;
                    vfxCtx.beginPath(); vfxCtx.arc(tp.x, tp.y, tp.size * tp.life, 0, Math.PI*2); vfxCtx.fill();
                }
                vfxCtx.globalCompositeOperation = 'source-over'; // 기본값 복구

                // 4. 명언 텍스트 연출 (오라색 그림자)
                if (progress > 0.25 && progress < 0.7) {
                    let textAlpha = progress < 0.35 ? (progress - 0.25)/0.1 : (progress > 0.6 ? (0.7 - progress)/0.1 : 1);
                    vfxCtx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`;
                    vfxCtx.font = "italic 700 2.5rem 'Cinzel', 'Noto Sans KR', sans-serif";
                    vfxCtx.textAlign = "center";
                    vfxCtx.shadowBlur = 40; vfxCtx.shadowColor = aura.color;
                    // 글자 간격도 연출에 포함되게 꼼수 (letterSpacing)
                    vfxCtx.fillText(quote.split('').join(' '), W/2, H * 0.75); 
                    vfxCtx.shadowBlur = 0;
                }

                vfxCtx.restore(); // 카메라 패닝 복구

                // 5. ✨ [개선] IMPACT (충돌 및 거대 충격파) ✨
                if (progress >= 0.75) {
                    // 딱 닿는 순간
                    if (progress <= 0.76 && shockwaveRadius === 0) { 
                        playSound(sfxMeteorImpact);
                        shakeIntensity = 150; applyScreenShake(); // 화면 엄청 흔들림
                        vfxParticles.spawnExplosion(W/2, H, aura.color, 200, 50); // 파편 수 증가
                        vfxParticles.spawnExplosion(W/2, H, "#ffffff", 100, 60); 
                    }

                    // [추가] 화면 전체를 덮는 거대 충격파 링
                    shockwaveRadius += 40; // 링이 무지막지하게 빠르게 커짐
                    shockwaveAlpha -= 0.03; 
                    if(shockwaveAlpha > 0) {
                        vfxCtx.save();
                        vfxCtx.globalCompositeOperation = 'lighter';
                        vfxCtx.beginPath();
                        vfxCtx.arc(W/2, H, shockwaveRadius, 0, Math.PI*2);
                        vfxCtx.lineWidth = 40 * shockwaveAlpha;
                        vfxCtx.strokeStyle = `rgba(${r},${g},${b}, ${shockwaveAlpha})`;
                        vfxCtx.stroke();
                        // 2중 링 (흰색 코어)
                        vfxCtx.beginPath();
                        vfxCtx.arc(W/2, H, shockwaveRadius * 0.9, 0, Math.PI*2);
                        vfxCtx.lineWidth = 15 * shockwaveAlpha;
                        vfxCtx.strokeStyle = `rgba(255, 255, 255, ${shockwaveAlpha})`;
                        vfxCtx.stroke();
                        vfxCtx.restore();
                    }

                    // 섬광(화이트아웃) 효과
                    let flashAlpha = 1 - ((progress - 0.75) / 0.25);
                    vfxCtx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`; 
                    vfxCtx.fillRect(0, 0, W, H);
                    // 오라색 잔광
                    vfxCtx.globalCompositeOperation = 'lighter';
                    vfxCtx.fillStyle = `rgba(${r},${g},${b}, ${flashAlpha * 0.5})`; 
                    vfxCtx.fillRect(0, 0, W, H);
                    vfxCtx.globalCompositeOperation = 'source-over';
                }

                vfxAnimationId = requestAnimationFrame(animate);
            }
            vfxAnimationId = requestAnimationFrame(animate);
        }

        // 💡 [진짜 최종] 1억 분의 1 전용: 운석 디자인 개선 + 명언 복구 + 롱테이크 화이트아웃 페이드
        function triggerApocalypseVFX(aura, onComplete) {
            cancelAnimationFrame(vfxAnimationId);
            playSound(sfxMeteorFall); 
            
            let startTime = performance.now();
            // ★ 연출 시간 대폭 연장: 총 12초 (빌드업 5.5초 + 타이핑/홀드 4.5초 + 페이드아웃 2초)
            let duration = 12000; 

            // 🎵 [SOUND 1] 0초: 마법진 개방음 + 멀리서 떨어지는 운석음
            playSound(sfxMagicCircle);
            playSound(sfxMeteorFall); 

            // 🎵 [SOUND 2] 3.5초 후: 대기권을 찢는 날카로운 마찰음 시작
            setTimeout(() => { playSound(sfxMeteorFriction); }, 3500);

            let quote = getAuraQuote(aura.name);
            let [r, g, b] = hexToRgb(aura.color);

            // [설정] 빌드업 단계
            let startX = W * 0.8; let startY = -H * 0.2;
            let endX = W * 0.5;    let endY = H * 0.95;
            let mainAngle = Math.atan2(endY - startY, endX - startX);
            let pathLength = Math.sqrt(Math.pow(endX-startX, 2) + Math.pow(endY-startY, 2));

            // 서브 유성우 데이터
            let subMeteors = Array.from({length: 15}, () => ({
                offsetPerp: (Math.random() - 0.5) * W * 0.8, 
                offsetPara: (Math.random() - 0.5) * pathLength * 0.3, 
                speedMulti: Math.random() * 0.4 + 0.8,
                size: Math.random() * 15 + 8
            }));

            let trailParticles = [];
            let shockwaveRadius = 0;

            // [설정] 타이밍 변수
            let impactTimeRatio = 0.45; // 45% 시점 (약 5.4초)에 충돌
            let typingStarted = false;
            let typeStartTime = 0;
            let typeDelay = 100; // 타자 속도
            let probabilityText = `1 IN ${aura.chanceX.toLocaleString()}`;

            function animate(time) {
                let elapsed = time - startTime;
                let progress = Math.min(elapsed / duration, 1.0);

                if (progress >= 1.0) {
                    vfxCtx.clearRect(0, 0, W, H);
                    if(onComplete) onComplete();
                    return;
                }

                vfxCtx.clearRect(0, 0, W, H);

                // ============================================================
                // PHASE 1: 빌드업 (마법진 + 명언 + 찐 운석 낙하) (0% ~ 45%)
                // ============================================================
                if (progress < impactTimeRatio) {
                    // 배경 및 카메라 패닝
                    vfxCtx.save();
                    let cameraY = lerp(0, H*0.4, progress/impactTimeRatio);
                    vfxCtx.translate(0, cameraY - H*0.4);
                    let spaceAlpha = (cameraY / (H*0.4));
                    if (spaceAlpha > 0.01) {
                        vfxCtx.fillStyle = `rgba(3, 1, 8, ${spaceAlpha})`; 
                        vfxCtx.fillRect(0, 0, W, H + H*0.5);
                    }

                    // 💡 [수정1] 마법진 유지 시간 연장 (충돌 직전까지 유지되며 커짐)
                    vfxCtx.save();
                    vfxCtx.translate(startX, startY);
                    let magicProg = progress / impactTimeRatio;
                    // 처음엔 서서히 나타나고, 끝까지 회전하며 거대해짐
                    let magicOpacity = magicProg < 0.2 ? magicProg * 5 : (1 - magicProg);
                    let magicScale = 1.0 + magicProg * 1.5;
                    vfxCtx.scale(magicScale, magicScale);
                    drawMagicCircle(vfxCtx, 0, 0, 300, progress * 4, aura.color, magicOpacity);
                    vfxCtx.restore();

                    // 💡 [수정2] 누락된 명언 텍스트 복구
                    if (progress > 0.1 && progress < impactTimeRatio - 0.05) {
                        let quoteProg = (progress - 0.1) / (impactTimeRatio - 0.15);
                        let textAlpha = quoteProg < 0.2 ? quoteProg/0.2 : (quoteProg > 0.8 ? (1-quoteProg)/0.2 : 1);
                        vfxCtx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`;
                        vfxCtx.font = "italic 700 2.8rem 'Cinzel', 'Noto Sans KR', sans-serif";
                        vfxCtx.textAlign = "center";
                        vfxCtx.shadowBlur = 40; vfxCtx.shadowColor = aura.color;
                        vfxCtx.fillText(quote, W/2, H * 0.75 + H*0.4 - cameraY); // 카메라 보정
                        vfxCtx.shadowBlur = 0;
                    }

                    vfxCtx.globalCompositeOperation = 'lighter';

                    // 💡 [수정3] "정자 탈출" 운석 디자인 (불규칙한 화염 덩어리)
                    function drawRockMeteor(ctx, x, y, angle, size, isMain) {
                        ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
                        
                        // 거친 화염 꼬리 (여러 겹의 삼각형으로 레이어링)
                        let tailLen = size * (isMain ? 15 : 10);
                        for(let i=0; i<3; i++) {
                            let tLen = tailLen * (1 - i*0.2);
                            let tWidth = size * (1.5 - i*0.3);
                            let tailGrad = ctx.createLinearGradient(0, 0, -tLen, 0);
                            tailGrad.addColorStop(0, isMain && progress > 0.35 ? '#fff' : aura.color);
                            tailGrad.addColorStop(1, 'transparent');
                            ctx.fillStyle = tailGrad;
                            ctx.beginPath();
                            ctx.moveTo(size*0.5, 0);
                            ctx.lineTo(-tLen, -tWidth);
                            ctx.lineTo(-tLen*0.8, 0); // 꼬리 끝이 갈라지는 느낌
                            ctx.lineTo(-tLen, tWidth);
                            ctx.fill();
                        }
                        
                        // 운석 본체 (울퉁불퉁한 바위 느낌)
                        ctx.fillStyle = isMain && progress > 0.35 ? "#ffffff" : aura.color;
                        ctx.shadowBlur = size * 3; ctx.shadowColor = aura.color;
                        ctx.beginPath();
                        let points = 7;
                        for(let i=0; i<points; i++) {
                            let rad = size * (0.8 + Math.random() * 0.4);
                            let a = (Math.PI * 2 / points) * i;
                            if(i===0) ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad);
                            else ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
                        }
                        ctx.closePath(); ctx.fill();
                        ctx.restore();
                    }

                    // 서브 유성우
                    let meteorProg = Math.max(0, (progress - 0.05) / (impactTimeRatio - 0.1));
                    subMeteors.forEach(sub => {
                        let currentDist = (pathLength * meteorProg * sub.speedMulti) + sub.offsetPara;
                        if (currentDist > -100 && currentDist < pathLength * 1.1) {
                            let mx = startX + Math.cos(mainAngle) * currentDist;
                            let my = startY + Math.sin(mainAngle) * currentDist;
                            let finalX = mx + Math.cos(mainAngle - Math.PI/2) * sub.offsetPerp;
                            let finalY = my + Math.sin(mainAngle - Math.PI/2) * sub.offsetPerp;
                            drawRockMeteor(vfxCtx, finalX, finalY, mainAngle, sub.size, false);
                        }
                    });

                    // 메인 거대 운석
                    let fallProgress = (progress - 0.1) / (impactTimeRatio - 0.1);
                    if (fallProgress > 0) {
                        fallProgress = fallProgress * fallProgress * fallProgress; // 무겁게 가속
                        let mX = lerp(startX, endX, fallProgress);
                        let mY = lerp(startY, endY, fallProgress);
                        let mainSize = 60 + fallProgress * 50; 
                        drawRockMeteor(vfxCtx, mX, mY, mainAngle, mainSize, true);

                        // 압도적으로 많은 화염 잔해 파티클
                        for(let k=0; k<3; k++) {
                            trailParticles.push({
                                x: mX + (Math.random()-0.5)*mainSize, y: mY + (Math.random()-0.5)*mainSize, 
                                vx: Math.cos(mainAngle + Math.PI)* 35 + (Math.random()-0.5)*30, 
                                vy: Math.sin(mainAngle + Math.PI)* 35 + (Math.random()-0.5)*30,
                                life: 1.0, size: Math.random() * 25 + 5, decay: Math.random()*0.02+0.01
                            });
                        }
                    }
                    
                    // 잔해 렌더링
                    for(let i=trailParticles.length-1; i>=0; i--) {
                        let tp = trailParticles[i]; tp.x += tp.vx; tp.y += tp.vy; tp.life -= tp.decay;
                        if(tp.life <= 0) { trailParticles.splice(i, 1); continue; }
                        vfxCtx.fillStyle = `rgba(${r},${g},${b},${tp.life})`;
                        vfxCtx.shadowBlur = 15; vfxCtx.shadowColor = aura.color;
                        vfxCtx.beginPath(); vfxCtx.arc(tp.x, tp.y, tp.size * tp.life, 0, Math.PI*2); vfxCtx.fill();
                    }
                    vfxCtx.globalCompositeOperation = 'source-over';
                    vfxCtx.restore(); // 카메라 패닝 끝
                }

                // ============================================================
                // PHASE 2: 화이트아웃 & 타이핑 & 페이드아웃 (45% ~ 100%)
                // ============================================================
                else {
                    // 💥 1. 충돌 폭발 (딱 한 번)
                    if (shockwaveRadius === 0) { 
                        // 🎵 [SOUND 3 & 4] 압도적인 폭발음 + 귀가 멍해지는 이명 소리(정적)
                        playSound(sfxMeteorImpact);
                        playSound(sfxFlashbangRing);
                        // 진동 시작
                        shakeIntensity = 100; applyScreenShake(); 
                        vfxParticles.spawnExplosion(W/2, H*0.95, "#ffffff", 500, 120); 
                    }

                    // ⚪ 2. 화이트아웃 투명도 계산
                    let fadeOutStart = 0.85; 
                    let whiteOpacity = 1.0;
                    if (progress < impactTimeRatio + 0.02) {
                        whiteOpacity = (progress - impactTimeRatio) / 0.02; // 순식간에 하얘짐
                    } else if (progress > fadeOutStart) {
                        whiteOpacity = 1 - ((progress - fadeOutStart) / (1 - fadeOutStart));
                    }

                    // 흰색 배경 그리기
                    if (whiteOpacity > 0) {
                        vfxCtx.fillStyle = `rgba(255, 255, 255, ${whiteOpacity})`;
                        vfxCtx.fillRect(0, 0, W, H);
                    }

                    // 💡 [최종 해결] 화면이 완전히 하얘지는 순간, 진동 끄기 + 화면 중앙 강제 고정!
                    // (비동기로 도는 진동 루프를 강제로 제압합니다)
                    if (whiteOpacity >= 1.0 && shakeIntensity > 0) {
                        shakeIntensity = 0; 
                        canvas.style.transform = "translate(0px,0px)";
                        vfxCanvas.style.transform = "translate(0px,0px)";
                    }

                    // ⌨️ 3. 필기체 타이핑 & 2초 홀드 (하얀 배경 위일 때만)
                    let textEndRatio = fadeOutStart - 0.05; 
                    if (progress < textEndRatio) {
                        if (!typingStarted) {
                            typingStarted = true;
                            typeStartTime = time + 500; // 화이트아웃 0.5초 후 타이핑 시작
                        }

                        if (time > typeStartTime) {
                            let charsToShow = Math.floor((time - typeStartTime) / typeDelay);
                            let typeIndex = Math.min(charsToShow, aura.name.length);
                            let currentTypedText = aura.name.substring(0, typeIndex);

                            let typingFinishTime = typeStartTime + (aura.name.length * typeDelay);
                            let holdDuration = 2000; // 2초 유지
                            let disappearStartTime = typingFinishTime + holdDuration;
                            
                            let textAlpha = 1.0;
                            if (time > disappearStartTime) {
                                textAlpha = 1 - Math.min(1, (time - disappearStartTime) / 500); 
                            }

                            if (textAlpha > 0) {
                                vfxCtx.save();
                                let darkR = Math.floor(r * 0.7); let darkG = Math.floor(g * 0.7); let darkB = Math.floor(b * 0.7);
                                
                                // [메인] 오라 이름 (Great Vibes)
                                vfxCtx.font = "400 8rem 'Great Vibes', cursive"; 
                                vfxCtx.fillStyle = `rgba(${darkR}, ${darkG}, ${darkB}, ${textAlpha})`;
                                vfxCtx.textAlign = "center";
                                vfxCtx.textBaseline = "middle";
                                vfxCtx.shadowBlur = 30 * textAlpha; 
                                vfxCtx.shadowColor = `rgba(${r},${g},${b},0.4)`;
                                vfxCtx.fillText(currentTypedText, W/2, H/2 - 40);

                                // [서브] 확률 텍스트
                                if (typeIndex === aura.name.length) {
                                    let subFade = Math.min(1, (time - typingFinishTime) / 1000); 
                                    vfxCtx.font = "700 1.8rem 'Rajdhani', sans-serif";
                                    vfxCtx.fillStyle = `rgba(0, 0, 0, ${Math.min(textAlpha, subFade)})`; 
                                    vfxCtx.shadowBlur = 0;
                                    vfxCtx.fillText(probabilityText, W/2, H/2 + 60);
                                }
                                vfxCtx.restore();
                            }
                        }
                    }
                }

                vfxAnimationId = requestAnimationFrame(animate);
            }
            vfxAnimationId = requestAnimationFrame(animate);
        }

        function hexToRgb(hex) { let bigint = parseInt(hex.slice(1), 16); return [ (bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255 ]; }
        function lerp(start, end, t) { return start * (1 - t) + end * t; }

        // ★ [기믹 4] 숨겨진 글리치 날씨가 추가되었습니다. (0.5% 확률)
        const weathers = [

        function getCurrentSkyColors(preciseHour) { 
            // ★ [기믹 4] 글리치 날씨 전용 기괴한 하늘색
            if(currentWeather.id === "glitch") return { top: [0, 0, 0], bot: [139, 0, 139], sun: [255, 0, 255] };
            if(currentWeather.id === "eclipse") return { top: [15, 5, 10], bot: [40, 15, 20], sun: [255, 120, 50] };
            if(currentWeather.id === "blood-moon") return { top: [35, 0, 0], bot: [80, 10, 10], sun: [255, 0, 0] };
            if(currentWeather.id === "thunder") return { top: [17, 17, 21], bot: [27, 39, 53], sun: [255, 255, 255] };
            if(currentWeather.id === "cloudy" || currentWeather.id === "foggy") return { top: [84, 110, 122], bot: [176, 190, 197], sun: [255, 255, 255] };

            let prev = skyKeyframes[0], next = skyKeyframes[skyKeyframes.length - 1]; 
            for (let i = 0; i < skyKeyframes.length - 1; i++) { 
                if (preciseHour >= skyKeyframes[i].h && preciseHour <= skyKeyframes[i+1].h) { prev = skyKeyframes[i]; next = skyKeyframes[i+1]; break; } 
            } 
            let factor = (preciseHour - prev.h) / (next.h - prev.h); 
            
            let top = [Math.round(lerp(prev.top[0], next.top[0], factor)), Math.round(lerp(prev.top[1], next.top[1], factor)), Math.round(lerp(prev.top[2], next.top[2], factor))]; 
            let bot = [Math.round(lerp(prev.bot[0], next.bot[0], factor)), Math.round(lerp(prev.bot[1], next.bot[1], factor)), Math.round(lerp(prev.bot[2], next.bot[2], factor))]; 
            let sun = [Math.round(lerp(prev.sun[0], next.sun[0], factor)), Math.round(lerp(prev.sun[1], next.sun[1], factor)), Math.round(lerp(prev.sun[2], next.sun[2], factor))]; 
            return { top, bot, sun }; 
        }

        // 💡 [기능 복구] 역동적인 푸른빛 가지 번개(Forked Lightning) 생성
        function triggerLightning() {
            playSound(sfxLightning); 
            shakeIntensity = 25; applyScreenShake(); // 천둥 충격

            // 화면 전체 번쩍임 (화이트 플래시)
            let flash = document.getElementById("lightning-flash");
            flash.style.opacity = 0.8;
            setTimeout(() => { flash.style.opacity = 0; }, 80);

            let startX = Math.random() * W;
            let bolts = [];
            
            // [메인 번개]
            let curX = startX, curY = 0;
            let points = [{x: curX, y: curY}];
            while(curY < H) {
                curX += (Math.random() - 0.5) * 200; // 좌우로 크게 꺾임
                curY += Math.random() * 80 + 30;
                points.push({x: curX, y: curY});
            }
            bolts.push({points: points, width: 4, alpha: 1.0});

            // [서브 가지 번개] 3~4개 생성
            let branches = Math.floor(Math.random() * 2) + 2;
            for(let i=0; i<branches; i++) {
                let splitIdx = Math.floor(Math.random() * (points.length - 2)) + 1;
                let subX = points[splitIdx].x;
                let subY = points[splitIdx].y;
                let subPoints = [{x: subX, y: subY}];
                for(let j=0; j<6; j++) {
                    subX += (Math.random() - 0.5) * 150;
                    subY += Math.random() * 70 + 20;
                    subPoints.push({x: subX, y: subY});
                }
                bolts.push({points: subPoints, width: 1.5, alpha: 0.7});
            }

            lightningBolts.push({ group: bolts, life: 1.0 });
        }

        // 💡 [기능 복구] 번개 렌더링 (일렉트릭 블루 글로우 효과)
        function renderLightning(ctx) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter'; // 번개끼리 겹치면 더 밝아짐

            for(let i = lightningBolts.length - 1; i >= 0; i--) {
                let boltObj = lightningBolts[i];
                
                boltObj.group.forEach(bolt => {
                    ctx.beginPath();
                    ctx.moveTo(bolt.points[0].x, bolt.points[0].y);
                    for(let j=1; j<bolt.points.length; j++) {
                        ctx.lineTo(bolt.points[j].x, bolt.points[j].y);
                    }
                    ctx.strokeStyle = `rgba(220, 240, 255, ${boltObj.life * bolt.alpha})`;
                    ctx.lineWidth = bolt.width;
                    ctx.shadowBlur = 40;
                    ctx.shadowColor = "#00e5ff"; // 푸른색 광원
                    ctx.stroke();
                });

                boltObj.life -= 0.05; // 0.3초 만에 빠르게 사라짐
                if(boltObj.life <= 0) lightningBolts.splice(i, 1);
            }
            ctx.restore();
        }

        function renderLand(layer, index, fogRgb) { 
            let offsetX = -currentParallaxX * 100 * layer.depth; let offsetY = -currentParallaxY * 50 * layer.depth; 
            ctx.beginPath(); ctx.moveTo(offsetX - W, H); 
            for (let i = 0; i < layer.points.length - 1; i++) {
                let p1 = layer.points[i], p2 = layer.points[i+1]; let cpX = (p1.x + p2.x) / 2, cpY = (p1.y + p2.y) / 2;
                ctx.quadraticCurveTo(p1.x + offsetX, p1.y + offsetY, cpX + offsetX, cpY + offsetY);
            }
            ctx.lineTo(W + offsetX + W, H); ctx.closePath(); 
            let [r, g, b] = layer.color; let isNight = (hours < 6 || hours > 18); let darkFactor = isNight ? 0.25 : 1.0; r *= darkFactor; g *= darkFactor; b *= darkFactor; 
            
            if (index < 2) { let s = mountainSnowLevel + (currentSnow * 0.5); r = lerp(r, 255, s); g = lerp(g, 255, s); b = lerp(b, 255, s); } 
            else { r = lerp(r, 255, currentSnow); g = lerp(g, 255, currentSnow); b = lerp(b, 255, currentSnow); } 
            
            let haze = Math.min(1.0, layer.baseFog + (currentFog * 0.8)); r = lerp(r, fogRgb[0], haze); g = lerp(g, fogRgb[1], haze); b = lerp(b, fogRgb[2], haze); 
            
            // 💡 [그래픽 개선] 단색 채우기 대신 세로 그라데이션 적용 (위는 밝고 아래는 어둡게)
            let grad = ctx.createLinearGradient(0, H * 0.4, 0, H);
            grad.addColorStop(0, `rgb(${r},${g},${b})`);
            grad.addColorStop(1, `rgb(${r * 0.5},${g * 0.5},${b * 0.5})`); // 아래로 갈수록 50% 어두워짐
            ctx.fillStyle = grad; 
            ctx.fill(); 
        }

        function renderTrees(layerIndex, fogRgb) { 
            let layer = landscapes[layerIndex]; let offsetX = -currentParallaxX * 100 * layer.depth; let offsetY = -currentParallaxY * 50 * layer.depth; 
            let haze = Math.min(1.0, layer.baseFog + (currentFog * 0.8)); let isNight = (hours < 6 || hours > 18); 
            trees.forEach(t => { 
                t.x = t.baseX + offsetX; t.y = t.baseY + offsetY; let scale = t.size; let trunkH = 50 * scale, trunkW = 12 * scale; let foliageR = 30 * scale; 
                let tr=50, tg=30, tb=20; tr = lerp(tr, fogRgb[0], haze); tg = lerp(tg, fogRgb[1], haze); tb = lerp(tb, fogRgb[2], haze); 
                ctx.fillStyle = `rgb(${tr},${tg},${tb})`; ctx.fillRect(t.x - trunkW/2, t.y - trunkH, trunkW, trunkH); 
                let lr=isNight?10:46, lg=isNight?30:122, lb=isNight?10:50; 
                lr = lerp(lr, fogRgb[0], haze); lg = lerp(lg, fogRgb[1], haze); lb = lerp(lb, fogRgb[2], haze); 
                ctx.fillStyle = `rgb(${lr},${lg},${lb})`; 
                ctx.beginPath(); ctx.moveTo(t.x, t.y - trunkH - foliageR); ctx.arc(t.x, t.y - trunkH - foliageR*0.7, foliageR, 0, Math.PI * 2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(t.x - foliageR*0.6, t.y - trunkH, foliageR*0.7, 0, Math.PI * 2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(t.x + foliageR*0.6, t.y - trunkH, foliageR*0.7, 0, Math.PI * 2); ctx.fill(); 
                if (currentSnow > 0.1) { ctx.fillStyle = `rgba(255,255,255,${currentSnow * (1 - haze)})`; ctx.beginPath(); ctx.arc(t.x, t.y - trunkH - foliageR*0.7, foliageR*0.8, Math.PI, 0); ctx.fill(); } 
                if(isNight && Math.random() < 0.05) vfxParticles.spawnFirefly(t.x + (Math.random()-0.5)*50, t.y - trunkH - (Math.random()*50), "#b3e5fc");
            }); 
        }

        function renderGrass(fogRgb) { 
            let layer = landscapes[3]; let offsetX = -currentParallaxX * 100 * layer.depth; let offsetY = -currentParallaxY * 50 * layer.depth; 
            let haze = Math.min(1.0, layer.baseFog + (currentFog * 0.8)); ctx.lineWidth = 1.5; ctx.lineCap = "round";

                r = lerp(r, 255, currentSnow); gr = lerp(gr, 255, currentSnow); b = lerp(b, 255, currentSnow);

                ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.quadraticCurveTo(g.x + g.sway / 2, g.y - g.h / 1.5, g.x + g.sway, g.y - g.h); ctx.stroke(); 
            }); 
        }

        function spawnWeatherParticle() {
            let z = Math.random() * 0.9 + 0.1; 
            let startX = Math.random() * W;
            let startY = -50; 
            
            let vx = (Math.random() - 0.5) * 3; 
            let vy = (currentWeather.id === "thunder") ? (35 * z) : (currentWeather.id === "rain") ? (25 * z) : (currentWeather.id === "snow" ? (4 * z) : 1); 
            let size = 2 * z;

            // 💡 [수정] 글리치(차원 붕괴) 전용 데이터 파티클 속성

            if (currentWeather.id === "glitch") {
                vy = 10 + Math.random() * 20; // 빠르게 떨어짐
                size = Math.random() * 15 + 10; // 폰트 크기

            }

            if (currentWeather.id === "snow") { size = (4 * z) + 3; }
            if(currentWeather.id === "wind") { startX = -50; startY = Math.random() * H; vx = 25 + Math.random() * 20; vy = (Math.random() - 0.5) * 4; size = Math.random() * 40 + 20; }

            weatherParticles.push({ x: startX, y: startY, z: z, vx: vx, vy: vy, size: size, weatherType: currentWeather.id, opacity: currentWeather.id === "foggy" ? Math.random() * 0.02 : 0.3 + (0.5 * z), char: char }); 
        }

        function renderWeatherLayer(minZ, maxZ) { 
            ctx.lineWidth = 2; 
            for (let i = weatherParticles.length - 1; i >= 0; i--) {
                let p = weatherParticles[i];
                if (p.z >= minZ && p.z < maxZ) { 
                    let px = p.x - currentParallaxX * 100 * p.z; let py = p.y - currentParallaxY * 50 * p.z; 
                    
                    if (p.weatherType === "snow") { ctx.fillStyle = `rgba(255,255,255,${p.opacity})`; ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI * 2); ctx.fill(); } 
                    else if (p.weatherType === "rain" || p.weatherType === "thunder") { ctx.strokeStyle = `rgba(173, 216, 230, ${p.opacity})`; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + p.vx, py + p.vy); ctx.stroke(); } 
                    else if (p.weatherType === "wind") { ctx.strokeStyle = `rgba(255, 255, 255, ${p.opacity * 0.5})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + p.size, py); ctx.stroke(); } 
                    else if (p.weatherType === "foggy") { let grad = ctx.createRadialGradient(px, py, 0, px, py, p.size); grad.addColorStop(0, `rgba(255,255,255, ${p.opacity})`); grad.addColorStop(1, `rgba(255,255,255, 0)`); ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI * 2); ctx.fill(); } 
                    
                    // 💡 [핵심] 글리치 데이터(0, 1) 매트릭스 렌더링
                    else if (p.weatherType === "glitch") {
                        ctx.font = `bold ${p.size}px monospace`;
                        // 10% 확률로 색상이 빨강/파랑으로 깜빡임
                        let r = Math.random();
                        ctx.fillStyle = r < 0.05 ? "#ff003c" : r < 0.1 ? "#00ffff" : `rgba(0, 255, 100, ${p.opacity})`;
                        ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
                        ctx.fillText(p.char, px, py);
                        ctx.shadowBlur = 0;
                        // 5% 확률로 떨어지면서 숫자가 바뀜
                        if (Math.random() < 0.05) p.char = Math.random() < 0.5 ? "0" : "1";
                    }
                    
                    p.x += p.vx; p.y += p.vy; 
                    
                    if (p.y > H + 50 || p.x > W + p.size || p.x < -50 || p.y < -50) {

        let activeSpawns = [];
        setInterval(() => {
            let itemData = consumableDB[currentWeather.id] || consumableDB["clear"];

                p.screenX = renderX; p.screenY = renderY;

                if (w.condition === "NIGHT" && isDay) return false;
                return true;
            });

            let totalChance = availableWeathers.reduce((sum, w) => sum + w.chance, 0);
            let r = Math.random() * totalChance;
            let acc = 0;
            for (let w of availableWeathers) {

            let spinTime = 0, currentDelay = 15; const MAX_SPIN_TIME = 2000; 
            
            function spin() { 
                if (spinTime >= MAX_SPIN_TIME / globalSpeedMultiplier) { 
                    sfxSpin.pause(); sfxSpin.currentTime = 0; 

                    if (currentResult.chanceX >= skipThreshold && currentResult.chanceX >= 1000) {
                        fadeOutBGMForSuspense();
                    }

                    // 💡 [신규] 연출 스킵 체크
                    // 현재 결과의 확률이 설정한 값보다 작으면 연출 없이 바로 결과 표시
                    if (currentResult.chanceX < skipThreshold) {
                        showFinalResult();
                        return; // 아래의 모든 연출 로직을 무시하고 종료
                    }

                    // 💡 [추가] 1,000 이상의 연출이 확정되면 UI를 숨김
                    if (currentResult.chanceX >= 1000) {
                        setUIVisibility(false);
                        fadeOutBGMForSuspense();
                    }
                    
                    // ★ [기믹 3] 페이크 연출 발동 구간 ★
                    if (isFakeOut && fakeTargetAura) {
                        fadeOutBGMForSuspense();
                        playSound(sfxGlitch); 
                        
                        shakeIntensity = 50; applyScreenShake();
                        document.getElementById("glitch-overlay").style.opacity = 1;
                        document.getElementById("aura-text").classList.add("glitch-text");

                        setTimeout(() => {
                            document.getElementById("glitch-overlay").style.opacity = 0;
                            document.getElementById("aura-text").classList.remove("glitch-text");
                            currentResult = fakeTargetAura; 

                            // 💡 [수정] 글리치 후 운석/마법진 연출 시 텍스트 전체 숨김 처리
                            if (currentResult.chanceX >= 10000000) {
                                document.getElementById("stage").style.opacity = 0; // 텍스트 숨김
                                triggerMeteorVFX(currentResult, () => {
                                    restoreBGMWithImpact(); playSound(sfxSuccess); 
                                    document.getElementById("stage").style.opacity = 1; // 텍스트 복구
                                    showFinalResult();
                                });
                            } else if (currentResult.chanceX >= 1000) {
                                playSound(sfxReveal); 
                                document.getElementById("stage").style.opacity = 0; // 텍스트 숨김
                                triggerEpicVFX(currentResult); 
                                setTimeout(() => { 
                                    shakeIntensity = 20; applyScreenShake(); 
                                    vfxParticles.spawnExplosion(W/2, H/2-100, currentResult.color, 50, 15); 
                                    restoreBGMWithImpact(); playSound(sfxSuccess); 
                                    document.getElementById("stage").style.opacity = 1; // 텍스트 복구
                                    showFinalResult(); 
                                }, 1500); 
                            } else {
                                showFinalResult();
                            }
                        }, 800);
                        return;
                    }

                    // 1. [재앙급] 1억 분의 1 이상 (유성우 + 초거대 운석)
                    if (currentResult.chanceX >= 100000000) {
                        fadeOutBGMForSuspense();
                        document.getElementById("stage").style.opacity = 0; 
                        triggerApocalypseVFX(currentResult, () => {
                            restoreBGMWithImpact(); playSound(sfxSuccess); 
                            document.getElementById("stage").style.opacity = 1; 
                            showFinalResult();
                        });
                    }
                    // 2. [초월급] 1000만 분의 1 이상 (일반 운석 연출)
                    else if (currentResult.chanceX >= 10000000) {
                        fadeOutBGMForSuspense();
                        document.getElementById("stage").style.opacity = 0; 
                        triggerMeteorVFX(currentResult, () => {
                            restoreBGMWithImpact(); playSound(sfxSuccess); 
                            document.getElementById("stage").style.opacity = 1; 
                            showFinalResult();
                        });
                    } 
                    // 3. [전설급] 1,000 분의 1 이상 (마법진 및 별 연출)
                    else if (currentResult.chanceX >= 1000) { 
                        fadeOutBGMForSuspense(); playSound(sfxReveal); 
                        document.getElementById("stage").style.opacity = 0; 
                        triggerEpicVFX(currentResult); 
                        setTimeout(() => { 
                            shakeIntensity = 20; applyScreenShake(); 
                            vfxParticles.spawnExplosion(W/2, H/2-100, currentResult.color, 50, 15); 
                            restoreBGMWithImpact(); playSound(sfxSuccess); 
                            document.getElementById("stage").style.opacity = 1; 
                            showFinalResult(); 
                        }, 1500); 
                    } 
                    // 4. 그 이하 일반 등급
                    else { showFinalResult(); } 

                    return; 
                } 
                let dummyAura = allAuras[Math.floor(Math.random() * allAuras.length)];
                applyAuraStyle(dummyAura);
                spinTime += currentDelay; currentDelay *= 1.15; setTimeout(spin, currentDelay); 
            } 
            spin(); 
        });

        // 💡 [개선] 연출 종료 후 결과를 표시하고 BGM을 복구하는 함수
        function showFinalResult() { 
            // 1. 숨겼던 UI들을 다시 부드럽게 나타나게 함
            setUIVisibility(true);

            // 2. 배경음악 복구 및 결과 표시
            restoreBGMWithImpact();
            applyAuraStyle(currentResult);

            // 2. 최종 당첨된 오라 스타일 적용
            applyAuraStyle(currentResult); 

            // 3. 확률 텍스트 표시
            document.getElementById("odds-text").style.display = "block"; 

            // 4. 당첨 텍스트 '팡!' 터지는 시각 효과
            const auraText = document.getElementById("aura-text");
            auraText.style.transform = "scale(1.5)"; 
            setTimeout(() => {
                auraText.style.transform = "scale(1)";
            }, 150); 

            // 5. 유저 선택 버튼(저장/분해) 활성화
            document.getElementById("btn-keep").style.display = "block"; 
            document.getElementById("btn-discard").style.display = "block"; 
        }

        function resetRollState() { isRolling = false; document.getElementById("btn-keep").style.display = "none"; document.getElementById("btn-discard").style.display = "none"; document.getElementById("roll-btn").style.display = "block"; document.getElementById("odds-text").style.display = "none"; document.getElementById("aura-text").textContent = "Press Button To Roll..."; document.getElementById("aura-text").style.color = "white"; document.getElementById("aura-text").style.textShadow = "none"; }

        document.getElementById("btn-keep").addEventListener("click", () => { playSound(sfxSuccess); inventory.push(currentResult); saveGame(); resetRollState(); });
        document.getElementById("btn-discard").addEventListener("click", () => { playSound(sfxClick); fragments += Math.max(1, Math.ceil(currentResult.chanceX / 10)); saveGame(); resetRollState(); });

        // 💡 [복구] 프레임과 상관없이 현실 1초(1000ms)마다 정확히 깎이는 독립 타이머
        setInterval(() => {
            let buffChanged = false;
            Object.keys(activeBuffs).forEach(slot => {
                if (activeBuffs[slot] && activeBuffs[slot].timeLeft > 0) {
                    activeBuffs[slot].timeLeft--;
                    buffChanged = true;
                    if (activeBuffs[slot].timeLeft <= 0) {
                        activeBuffs[slot] = null; // 타이머 종료 시 슬롯 비우기
                    }
                }
            });
            if(buffChanged) calcBuffs();
        }, 1000);

        window.onload = () => { 
            loadGame(); 
            setTimeout(() => { changeWeather(); }, 500);
            document.body.addEventListener('click', () => { if (bgmPlayer.paused) { smoothAudioTransition(currentWeather.music, currentWeather.sfx); if(currentWeather.sfx) weatherSfxPlayer.play().catch(e=>{}); } }, { once: true }); 
        };

    </script>
</body>
